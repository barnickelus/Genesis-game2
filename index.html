    case 'echo': stunEcho(false); abil_cd=s.cd; break;
  }
}

// ═══════════════════════════════════════════
// TITAN — STUN ECHO
// ═══════════════════════════════════════════
// An expanding shockwave that stuns and arrests prey, so the slow colossus can
// still catch larger/faster creatures and sweep them into the intake. `auto` is
// the Colossus self-pulse (quieter, no screen shake spam).
function stunEcho(auto) {
  const eR = P.r * (titanPhase ? 4.6 : 3.6);
  for (const o of gNear(P.x, P.y, eR)) {
    const d = dst(P, o); if (d >= eR) continue;
    o.stunT = Math.max(o.stunT, auto ? 900 : 1400);
    o.flT = Math.max(o.flT, 150);
    o.vx *= .25; o.vy *= .25;                 // arrest momentum — fast prey can't flee
    const a = ang(P, o);                       // and nudge gently toward the maw
    o.vx += Math.cos(a) * .4; o.vy += Math.sin(a) * .4;
  }
  ring(P.x, P.y, COL.titan.pri, eR, auto ? 20 : 28);
  ring(P.x, P.y, '#cfeeff', eR*.6, 14);
  for (let i=0;i<(auto?12:20);i++){ const a=(i/(auto?12:20))*TAU; parts.push({x:P.x+Math.cos(a)*P.r,y:P.y+Math.sin(a)*P.r,vx:Math.cos(a)*4,vy:Math.sin(a)*4,r:2.4,life:420,ml:420,c:COL.titan.pri,t:'c'}); }
  if (!auto) { shk(3.5, 180); sfxEvo(); } else { shk(1.2, 90); }
  audioFilterPulse(STAGE_CUTOFF[P.stg]*1.4, .2);
}

// ═══════════════════════════════════════════
// TITAN — FILTER FEEDING (passive engulf)
// ═══════════════════════════════════════════
// Plankton-scale prey inside the intake current are drawn into the maw and
// consumed automatically. The intake widens (and the "what counts as plankton"
// ratio relaxes) once the giant reaches Colossus, so late TITAN truly filters
// the whole board. Larger prey are ignored here — they need the stun-echo + the
// normal bite (EAT_RATIO) to bring them down.
function filterFeed(dt) {
  if (P.stg !== 5) return;
  const intake = P.r * (titanPhase ? 3.4 : 2.3);
  const ratio  = titanPhase ? 0.58 : 0.42;     // o.r below this fraction of player = plankton
  const mouth  = P.r * 0.95;
  let eaten = 0;
  for (const o of gNear(P.x, P.y, intake)) {
    const d = dst(P, o); if (d >= intake) continue;
    if (o.r >= P.r * ratio) continue;          // too big to filter
    const t = 1 - d/intake, a = ang(o, P);
    o.vx += Math.cos(a) * (.5 + t*1.5);        // the intake current
    o.vy += Math.sin(a) * (.5 + t*1.5);
    if (d < mouth && eaten < 40) {
      const T = ORGS[o.type];
      // Lower filter yield (.6) — TITAN should grow slowly and serenely, not race.
      const gain = calcGain(T.mass*(o.massMul||1), P.mass) * .6;
      P.mass += gain; score += Math.floor(gain*6); eaten++;
      if (parts.length < 250) burst(o.x, o.y, T.col, 3, 1);
      const idx = orgs.indexOf(o); if (idx>=0) orgs.splice(idx,1);
      const cnt = orgs.filter(q=>q.type===o.type).length;
      if (cnt < ORGS[o.type].mx) setTimeout(()=>spawn(o.type,1), rng(700,2200));
    }
  }
  if (eaten) { checkEvo(); audioFilterPulse(STAGE_CUTOFF[P.stg]*1.5, .1); }
}

// ═══════════════════════════════════════════
// MICRO BRANCH — mitosis → swarm  (Steps 1–2)
// See docs/MICRO_BRANCH.md. COLOSSUS is a singularity, not a ceiling: once the
// lone cell hits the hard size limit, pressure builds until the player splits
// into a multicellular swarm. The colony-building fork tree comes after this.
// ═══════════════════════════════════════════

// Build the COLOSSUS "pressure" while pinned at the ceiling, and surface the
// one-time choice prompt. Called from updateP only during TITAN·COLOSSUS.
function updateBreakPressure(dt) {
  if (microMode !== 'single') return;
  if (P.stg === 5 && titanPhase === 1 && P.mass >= COLOSSUS_BREAK) {
    breakPressure = Math.min(1, breakPressure + dt / 4000);  // ~4s to full
    if (breakPressure >= 1 && !microChoiceShown) {
      microChoiceShown = true;
      microMode = 'choice';
      objBump('critical');     // TITAN's objective: you have reached the Singularity
      openSingularityFork();   // a real branch choice, not a single tap
    }
  } else {
    breakPressure = Math.max(0, breakPressure - dt / 2000);
  }
}

// THE SINGULARITY — the macro/micro fork. A two-card choice (reuses the adapt
// overlay styling). DIVIDE → mitosis → colony (micro). ASCEND → stay a single
// colossus and keep filter-feeding (macro path; full macro branch is a stub for now).
function openSingularityFork() {
  paused = true;
  const wrap = document.getElementById('adaptCards');
  wrap.innerHTML = '';
  document.getElementById('adaptTitle').textContent = 'THE SINGULARITY';
  document.getElementById('adaptSub').textContent = 'A single cell can grow no further. Choose your path.';
  const forks = [
    { name:'DIVIDE', cat:'MICRO · mitosis', desc:'Burst into a living colony of cells. Grow by numbers — feed cells until they divide, and shape the colony to filter the deep.', go:() => { document.getElementById('adapt').classList.remove('on'); paused=false; doMitosis(); } },
    { name:'ASCEND', cat:'MACRO · colossus', desc:'Stay whole. Remain the colossus and keep drawing the ocean in. (The macro branch expands in a future update.)', go:() => { document.getElementById('adapt').classList.remove('on'); paused=false; microMode='single'; breakPressure=0; announce('ASCENDANT','#5AC8FF','You remain singular. Filter on.',3000); } },
  ];
  for (const f of forks) {
    const card = document.createElement('div');
    card.className = 'adaptCard';
    card.innerHTML = `<div class="cCat">${f.cat}</div><div class="cName">${f.name}</div><div class="cDesc">${f.desc}</div><div class="cLv">CHOOSE</div>`;
    card.onclick = f.go;
    wrap.appendChild(card);
  }
  document.getElementById('adapt').classList.add('on');
}

// Fire mitosis: dissolve the single body into a cloud of swarm cells that carry
// the accumulated mass between them. Reuses the world's particle FX + audio.
function doMitosis() {
  // A FRESH colony — not a continuation of the giant's huge mass. Starting small
  // (≈14 mass/cell) makes growth visible and meaningful: a few good bites noticeably
  // grow a cell and push it toward dividing, instead of being lost in a 14k pool.
  const N = 24;
  const massEach = 14;
  P.mass = N * massEach;
  cells = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAU + rng(-.2, .2), d = rng(20, 70);
    cells.push({
      x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d,
      vx: Math.cos(a) * rng(2, 6), vy: Math.sin(a) * rng(2, 6),
      r: cl(3.4 + Math.sqrt(massEach) * .5, 3.4, 26), mass: massEach, ph: rng(0, TAU), bound: false, fed: 0,
    });
  }
  microMode = 'swarm';
  breakPressure = 0;
  // Big visual + audio beat
  burst(P.x, P.y, '#9CF0FF', 60, 6);
  ring(P.x, P.y, '#fff', P.r * 1.4, 40);
  ring(P.x, P.y, '#9CF0FF', P.r * 2.2, 30);
  shk(9, 600);
  try { sfxEvo(); audioBend(5, 1.6); } catch (e) {}
  announce('MITOSIS', '#9CF0FF', 'You are a swarm now. Steer the cloud; graze the deep.', 4200);
}

// ── Colony shapes (Step 3: shape = ability) ──────────────────────────────────
// Each shape is a slot generator: given a cell index, count, and a unit scale,
// it returns the cell's target offset (in colony-local space, +x = facing dir).
// Shapes span a MOBILITY SPECTRUM so different situations want different forms
// (the player's ask: travel form vs harvest form vs plant form):
//   dart     — condensed teardrop, fastest, low reach: the TRAVELER (cross gaps)
//   swarm    — loose flock, fast & wide: spread harvest
//   radial   — ring/bloom, balanced omnidirectional intake
//   filament — broadside rake, huge reach + yield, slow: harvest a dense patch
//   plant    — stationary, rooted: huge intake radius + passive photosynthesis,
//              but barely moves — camp on a rich patch and soak
// Fields: eatR reach · feed yield · spd colony speed · passive mass/sec/cell
const COLONY = {
  dart:     { eatR: 0.8, feed: 0.5, spd: 2.0,  passive: 0,    label: 'DART',     desc: 'Aerodynamic. Fastest travel, low intake — cross the void.' },
  swarm:    { eatR: 1.0, feed: 0.6, spd: 1.35, passive: 0,    label: 'SWARM',    desc: 'Fast & wide. Most coverage, least yield.' },
  radial:   { eatR: 1.5, feed: 0.8, spd: 1.0,  passive: 0,    label: 'RADIAL',   desc: 'The bloom. Eats from all sides, balanced.' },
  filament: { eatR: 2.0, feed: 1.0, spd: 0.7,  passive: 0,    label: 'FILAMENT', desc: 'The net. Huge reach + best yield, but slow.' },
  plant:    { eatR: 2.4, feed: 1.1, spd: 0.28, passive: 0.06, label: 'PLANT',    desc: 'Rooted. Vast intake + photosynthesis, but nearly still.' },
};
const COLONY_ORDER = ['dart', 'swarm', 'radial', 'filament', 'plant'];  // mobile → stationary
const CELL_SPLIT = 9;    // mass a cell must eat before it divides into a new cell
const CELL_MAX   = 160;  // hard cap on cell count (perf)
const PLANT_RAMP_MS  = 12000;  // time rooted to reach max photosynthesis ramp
const PLANT_RAMP_MAX = 2.5;    // ramp cap — bounded so PLANT can't trivialize other forms

// ── Food PATCHES — clumped resources with gaps between them, so morph choice
// matters: dart across the void, then swarm/filament/plant to harvest. Each patch
// is a drifting nutrient bloom that depletes as you eat it and regrows slowly.
let patches = [];
const PATCH_MAX = 5;

// ── HIVES — autonomous satellite colonies you bud off ("grow → break off → start
// a new hive"). A budded hive drifts to the nearest rich patch, harvests it on its
// own, and periodically sends a tribute of mass back to you. More hives = more
// passive territory control & income, at the cost of the mass spent to spawn one.
let hives = [];
const HIVE_MAX = 6;
const HIVE_COST = 90;       // mass to bud a hive (also its starting size)
const BUD_THRESHOLD = 220;  // colony mass needed before you can bud

// Local-space target slot for cell i of n in the active shape. Scale grows with
// cell count so bigger colonies sweep wider. x axis = colony facing.
function colonySlot(i, n, scale) {
  switch (colonyShape) {
    case 'dart': {
      // Condensed teardrop pointing along facing (+x): a tight, aerodynamic body.
      const a = i * 2.39996323, rr = scale * 0.5 * Math.sqrt((i + .5) / n);
      return { x: Math.cos(a) * rr * 1.5 + scale * 0.3, y: Math.sin(a) * rr * 0.7 };
    }
    case 'filament': {
      // Cells strung broadside (perpendicular to facing): a wide rake.
      const t = n > 1 ? i / (n - 1) - 0.5 : 0;          // -0.5..0.5
      const wave = Math.sin(t * PI) * scale * 0.18;      // gentle bow
      return { x: wave, y: t * scale * 4.2 };
    }
    case 'radial': {
      const a = (i / n) * TAU;
      const rr = scale * 1.7;
      return { x: Math.cos(a) * rr, y: Math.sin(a) * rr };
    }
    case 'plant': {
      // Rooted rosette — cells fan out in a broad, dense disc (max intake area).
      const a = i * 2.39996323, rr = scale * 1.5 * Math.sqrt((i + .5) / n);
      return { x: Math.cos(a) * rr, y: Math.sin(a) * rr };
    }
    default: return null;  // swarm: no slot
  }
}

// Swarm/colony physics: in 'swarm' cells flock toward the pointer; in a bound
// shape each cell seeks its slot (center + rotated offset). Cells eat plankton
// on contact into a shared pool we mirror back into P.* so the rest of the
// engine (camera, HUD, evo bar, world) keeps working unchanged.
function updateSwarm(dt) {
  if (microMode !== 'swarm') return;
  const target = ptr.on ? { x: ptr.x, y: ptr.y } : { x: P.x, y: P.y };
  const cfg = COLONY[colonyShape] || COLONY.swarm;
  const bound = colonyShape !== 'swarm';

  // Centroid (drives camera + world systems via P)
  let cxg = 0, cyg = 0, totalMass = 0;
  for (const c of cells) { cxg += c.x; cyg += c.y; totalMass += c.mass; }
  const n = cells.length || 1;
  cxg /= n; cyg /= n;

  // Colony heading: smoothly track travel direction (used to orient shaped slots).
  const mvx = target.x - cxg, mvy = target.y - cyg;
  if (Math.hypot(mvx, mvy) > 6) {
    const want = Math.atan2(mvy, mvx);
    const d = Math.atan2(Math.sin(want - colonyHd), Math.cos(want - colonyHd));
    colonyHd += d * Math.min(1, dt * .004);
  }
  const cosH = Math.cos(colonyHd), sinH = Math.sin(colonyHd);
  const slotScale = 7 + Math.sqrt(n) * 3.4;             // wider with more cells

  const SEP = 16, NEIGH = 70;
  // Iterate a snapshot of the current cells; cells born this frame (from division)
  // are collected separately and appended after, so we don't mutate the list we're
  // looping and don't re-process newborns in the same frame.
  const roster = cells.slice();
  const newborns = [];
  let idx = 0;
  for (const c of roster) {
    c.ph += dt * .004;
    let ax, ay;
    if (bound) {
      // Seek assigned slot in the rotated shape — this is the "binding" force.
      const sl = colonySlot(idx, n, slotScale);
      const tx = cxg + sl.x * cosH - sl.y * sinH;
      const ty = cyg + sl.x * sinH + sl.y * cosH;
      ax = (tx - c.x) * .06; ay = (ty - c.y) * .06;
      // Plus a pull of the whole formation toward the pointer.
      ax += (target.x - cxg) * .0016; ay += (target.y - cyg) * .0016;
    } else {
      // Loose swarm: seek pointer + cohesion to centroid.
      const sa = ang(c, target);
      ax = Math.cos(sa) * .22; ay = Math.sin(sa) * .22;
      ax += (cxg - c.x) * .0015; ay += (cyg - c.y) * .0015;
    }
    // Local separation (kept in every mode so cells never stack)
    for (const o of gNearCells(c, NEIGH)) {
      if (o === c) continue;
      const dx = c.x - o.x, dy = c.y - o.y, dd = Math.hypot(dx, dy);
      const sep = bound ? SEP * .6 : SEP;
      if (dd > 0 && dd < sep) { const w = (sep - dd) / sep; ax += (dx / dd) * w * .9; ay += (dy / dd) * w * .9; }
    }
    // Auto-forage: each cell drifts toward the nearest edible plankton it senses.
    // This is what makes the colony actively FEED (and grow) even with light steering
    // — the player guides the cloud, the cells home in on the food within it.
    let bf = null, bfd = 200;
    for (const o of gNear(c.x, c.y, 200)) {
      if (o.r > c.r * 1.5) continue;
      const fd = dst(c, o); if (fd < bfd) { bfd = fd; bf = o; }
    }
    if (bf) { const fa = ang(c, bf); ax += Math.cos(fa) * .8; ay += Math.sin(fa) * .8; }
    c.vx = c.vx * (bound ? .82 : .9) + ax; c.vy = c.vy * (bound ? .82 : .9) + ay;
    const v = Math.hypot(c.vx, c.vy), VMAX = 7 * cfg.spd;
    if (v > VMAX) { c.vx = c.vx / v * VMAX; c.vy = c.vy / v * VMAX; }
    c.x += c.vx * (dt / 16); c.y += c.vy * (dt / 16);

    // Graze on contact. FIX: cells were r3.4 and could only eat <7.5px prey, but
    // COLOSSUS-era plankton is ~9–10px — so the colony never ate and mass froze.
    // Cells now grow with their own mass (so reach scales) and can eat anything up
    // to ~1.4× their radius. Eat reach + yield scale with the bound shape.
    const reach = c.r * (cfg.eatR + 0.8) + 10;
    for (const o of gNear(c.x, c.y, reach)) {
      if (!orgs.includes(o)) continue;
      if (o.r > c.r * 1.5) continue;            // can eat prey up to ~1.5× cell radius
      if (dst(c, o) < c.r * cfg.eatR + o.r + 4) {
        const T = ORGS[o.type];
        // Flat yield from prey mass (NOT diluted by colony mass) — the colony is a
        // fresh food chain, so every bite stays meaningful as it grows.
        const g = T.mass * (o.massMul || 1) * .5 * cfg.feed;
        c.mass += g; c.fed += g; score += Math.floor(g * 4);
        c.r = cl(3.4 + Math.sqrt(c.mass) * .5, 3.4, 26);   // cell visibly grows as it eats
        if (parts.length < 250) burst(o.x, o.y, T.col, 2, .8);
        if (o._patch) o._patch.food = Math.max(0, o._patch.food - 1);  // deplete the patch
        const oi = orgs.indexOf(o); if (oi >= 0) orgs.splice(oi, 1);
        // (no respawn here — colony food is replenished by updateColonyPatches via patches)
      }
    }
    // Growth objective: a well-fed cell DIVIDES into a new cell — the colony
    // literally grows in numbers as you feed it (mitosis all the way down).
    if (c.fed >= CELL_SPLIT && cells.length + newborns.length < CELL_MAX) {
      c.fed = 0; c.mass *= .6;
      c.r = cl(3.4 + Math.sqrt(c.mass) * .5, 3.4, 26);
      const na = rng(0, TAU);
      newborns.push({ x: c.x + Math.cos(na)*c.r*2, y: c.y + Math.sin(na)*c.r*2,
        vx: Math.cos(na)*2, vy: Math.sin(na)*2, r: c.r, mass: c.mass, ph: rng(0,TAU), bound:false, fed:0 });
      if (parts.length < 240) burst(c.x, c.y, '#9CF0FF', 4, 1.4);
    }
    idx++;
  }
  if (newborns.length) for (const nb of newborns) cells.push(nb);

  // PLANT passive: photosynthesis ONLY happens when ROOTED on a nutrient patch —
  // i.e. the colony is nearly stationary AND sitting in a food patch. This gives
  // the plant form a clear purpose ("find a rich patch, root down, soak the
  // nutrients") instead of generating mass from nothing. It never feeds the split
  // counter (that caused the old exponential runaway).
  plantRooted = false;
  if (cfg.passive > 0) {
    const onPatch = patches.some(p => p.food > 5 && dst(P, p) < p.r);
    // Smoothed stillness: track recent centroid drift so cell jitter doesn't
    // flicker the rooted state (which kept resetting the ramp). Rooted = the colony
    // hasn't been actively steered far recently.
    const drift = Math.hypot(cxg - (P._lx||cxg), cyg - (P._ly||cyg));
    P._drift = (P._drift || 0) * 0.9 + drift * 0.1;
    const still = P._drift < 3.0;
    if (onPatch && still) {
      plantRooted = true;
      // RAMP: the longer you stay rooted, the more the plant "reaches a form best
      // for this environment" — rate eases from 1× up to a 2.5× cap over ~12s.
      // Bounded two ways so it can't break the game / make other forms useless:
      //   (a) the ramp itself plateaus at PLANT_RAMP_MAX,
      //   (b) mass-based diminishing returns still throttle a large colony.
      plantRootT = Math.min(PLANT_RAMP_MS, plantRootT + dt);
      const ramp = 1 + (PLANT_RAMP_MAX - 1) * (plantRootT / PLANT_RAMP_MS);
      const scale = 1 / (1 + totalMass * 0.0025);  // heavier damping than before
      const add = cfg.passive * ramp * scale * (dt / 16);
      for (const c of cells) { c.mass += add; c.r = cl(3.4 + Math.sqrt(c.mass) * .5, 3.4, 26); }
      totalMass += add * cells.length;
    } else {
      plantRootT = Math.max(0, plantRootT - dt * 2);  // uprooting decays the ramp fast
    }
  } else { plantRootT = 0; }
  P._lx = cxg; P._ly = cyg;   // remember centroid for next-frame stillness check

  // Mirror swarm into the player proxy so camera/HUD/world keep functioning.
  P.x = cxg; P.y = cyg; P.mass = totalMass; P.hd = colonyHd;
  // Player radius for camera = spread of the cloud
  let spread = 0; for (const c of cells) spread = Math.max(spread, dst({x:cxg,y:cyg}, c));
  P.r = cl(spread * .6 + 20, 30, 600);
}

// Cycle the colony morphology. Binding/unbinding is the core "build" verb;
// each shape is a different feeding strategy (shape = ability).
function cycleColony() {
  if (microMode !== 'swarm') return;
  const i = COLONY_ORDER.indexOf(colonyShape);
  colonyShape = COLONY_ORDER[(i + 1) % COLONY_ORDER.length];
  const cfg = COLONY[colonyShape];
  announce(cfg.label, '#9CF0FF', cfg.desc, 2600);
  burst(P.x, P.y, '#9CF0FF', 18, 3); ring(P.x, P.y, '#9CF0FF', P.r * 1.2, 18);
  try { sfxEvo(); } catch (e) {}
}

// ── Food patches: clumped resource blooms with gaps between them ─────────────
// Maintains PATCH_MAX drifting patches around the colony. Food (orgs) spawns
// INSIDE patches, dense; the space between patches is empty, so crossing it is a
// real cost — that's what makes a fast "dart" form vs a harvest form matter.
function updateColonyPatches(dt) {
  // Spawn new patches at a distance until we have enough — always a next target.
  while (patches.length < PATCH_MAX) {
    const a = Math.random()*TAU, d = rng(700, 1500);   // far enough to require travel
    patches.push({ x: P.x + Math.cos(a)*d, y: P.y + Math.sin(a)*d,
      r: rng(140, 240), food: rng(28, 46), max: 46,
      vx: rng(-.2,.2), vy: rng(-.2,.2), ph: rng(0,TAU) });
  }
  for (let i = patches.length - 1; i >= 0; i--) {
    const p = patches[i];
    p.x += p.vx * (dt/16); p.y += p.vy * (dt/16); p.ph += dt*.001;
    p.food = Math.min(p.max, p.food + dt*.0008);        // slow regrow
    // Retire a patch that's been eaten down AND wandered far — frees a slot for a
    // fresh destination elsewhere.
    if (p.food < 4 && dst(P, p) > 900) { patches.splice(i, 1); continue; }
    if (dst(P, p) > 2600) { patches.splice(i, 1); continue; }
  }
  // Populate patches with food up to a global cap. Each patch holds a share.
  const cap = 240;
  if (orgs.length < cap) {
    for (let k = 0; k < 3 && orgs.length < cap; k++) {
      // Pick a patch weighted toward the one nearest the colony (so the place you
      // ARE stays fed while you harvest it).
      const p = patches[rni(0, patches.length)];
      if (!p || p.food < 3) continue;
      const pick = ['mote','polyp','bloom','mote','tendril','mote'][rni(0,6)];
      const a = Math.random()*TAU, d = Math.sqrt(Math.random()) * p.r;
      const T = ORGS[pick], r = rng(T.minR, T.maxR);
      orgs.push({ type:pick, x:p.x+Math.cos(a)*d, y:p.y+Math.sin(a)*d, r, br:r,
        hp:T.hp, mhp:T.hp, vx:0, vy:0, hd:Math.random()*TAU, massMul:1, _patch:p,
        stT:0, stunT:0, wAng:Math.random()*TAU, ph:rng(0,TAU), ambR:false, lAng:0, trail:[],
        flT:0, hSh:rng(-10,10), finPh:rng(0,TAU), breathPh:rng(0,TAU), eyeAng:0, scatterT:0,
        lobes: pick==='bloom' ? Array.from({length:5},()=>({a:rng(0,TAU),d:rng(.25,.4),r:rng(.45,.6),ph:rng(0,TAU)})) : null });
    }
  }
}

// Bud off a satellite hive. Costs HIVE_COST mass (drained from your cells), spawns
// an autonomous forager at the colony edge. Returns true if it budded.
function budHive() {
  if (microMode !== 'swarm') return false;
  const total = cells.reduce((a, c) => a + c.mass, 0);
  if (total < BUD_THRESHOLD || hives.length >= HIVE_MAX) return false;
  // Drain the cost proportionally across cells.
  const frac = HIVE_COST / total;
  for (const c of cells) { c.mass *= (1 - frac); c.r = cl(3.4 + Math.sqrt(c.mass) * .5, 3.4, 26); }
  const a = colonyHd + PI + rng(-.6, .6);   // bud out behind the colony's heading
  hives.push({
    x: P.x + Math.cos(a) * (P.r + 30), y: P.y + Math.sin(a) * (P.r + 30),
    vx: 0, vy: 0, mass: HIVE_COST, r: 14, ph: rng(0, TAU),
    target: null, tribute: 0, workers: 0, outT: 0,
  });
  burst(P.x, P.y, '#FFD860', 22, 3.2); ring(P.x, P.y, '#FFD860', P.r * 1.3, 18);
  announce('HIVE BUDDED', '#FFD860', 'It forages patches alone; gold couriers carry mass home down the supply line.', 3200);
  try { sfxEvo(); } catch (e) {}
  return true;
}

// Autonomous satellite hives: drift toward the richest patch, harvest it, grow,
// and periodically send a tribute of mass back to the player colony.
function updateHives(dt) {
  for (let i = hives.length - 1; i >= 0; i--) {
    const hv = hives[i];
    hv.ph += dt * .003;
    // Pick / refresh a target patch (richest within reason).
    if (!hv.target || patches.indexOf(hv.target) < 0 || hv.target.food < 5) {
      let best = null, bs = -1;
      for (const p of patches) { if (p.food < 6) continue; const sc = p.food / (dst(hv, p) + 200); if (sc > bs) { bs = sc; best = p; } }
      hv.target = best;
    }
    // Move toward target patch; once inside, home in on the nearest actual food
    // org in the patch (food is scattered across the patch radius, not at center).
    if (hv.target) {
      const spd = 2.4;
      const inPatch = dst(hv, hv.target) < hv.target.r;
      let steerX, steerY;
      if (inPatch) {
        // Seek nearest patch-food org within the patch.
        let bf = null, bd = 1e9;
        for (const o of gNear(hv.x, hv.y, hv.target.r)) {
          if (!o._patch) continue; const fd = dst(hv, o); if (fd < bd) { bd = fd; bf = o; }
        }
        const tgt = bf || hv.target;
        const a = ang(hv, tgt);
        steerX = Math.cos(a) * spd * 0.7; steerY = Math.sin(a) * spd * 0.7;
      } else {
        const a = ang(hv, hv.target);
        steerX = Math.cos(a) * spd; steerY = Math.sin(a) * spd;
      }
      hv.vx = lp(hv.vx, steerX, .06); hv.vy = lp(hv.vy, steerY, .06);
      // Harvest any food within reach (generous radius so it actually eats).
      for (const o of gNear(hv.x, hv.y, hv.r + 24)) {
        if (!orgs.includes(o) || !o._patch) continue;
        if (dst(hv, o) < hv.r + o.r + 10) {
          const T = ORGS[o.type]; hv.mass += T.mass * (o.massMul || 1) * .5;
          o._patch.food = Math.max(0, o._patch.food - 1);
          const oi = orgs.indexOf(o); if (oi >= 0) orgs.splice(oi, 1);
        }
      }
    } else { hv.vx *= .96; hv.vy *= .96; }
    hv.x += hv.vx * (dt / 16); hv.y += hv.vy * (dt / 16);
    hv.r = cl(8 + Math.sqrt(hv.mass) * .7, 8, 40);

    // Independent growth: staffed hives also grow on their own (workers tending it),
    // scaled by how many workers the colony has sent (hv.workers). This is the
    // "growth can happen in and from the hive independently" idea.
    hv.workers = hv.workers || 0;
    hv.mass += (0.02 + hv.workers * 0.015) * (dt / 16);

    // ── Two-way living supply chain ──────────────────────────────────────────
    // The mass economy is a smooth CONTINUOUS flow (no projectile-like lumps); the
    // visible "individuals" are a separate cosmetic mini-highway of tiny motes
    // flowing along the tether — subtle, same hue, only a faint leaving/arriving
    // tint difference. (Player note: it looked like the hive was shooting the colony.)
    const colonyMass = cells.reduce((a, c) => a + c.mass, 0);

    // OUTBOUND staffing: colony slowly invests workers into the hive (capped).
    hv.outT = (hv.outT || 0) + dt;
    if (hv.outT > 1400 && colonyMass > 120 && hv.workers < 12) {
      hv.outT = 0; hv.workers++;
      const cost = 5; if (cells.length) { const per = cost / cells.length; for (const c of cells) c.mass = Math.max(1, c.mass - per); }
    }

    // INBOUND yield: a productive hive returns mass as a smooth per-second trickle,
    // scaled by workers. No lump couriers — continuous, so it never reads as gunfire.
    if (hv.mass > HIVE_COST * 1.2 && colonyMass > 0) {
      const rate = (0.04 + hv.workers * 0.05) * (dt / 16);   // mass/frame returned home
      const give = Math.min(rate, hv.mass - HIVE_COST);
      if (give > 0) { hv.mass -= give; const per = give / cells.length; for (const c of cells) c.mass += per; }
    }

    // Cosmetic traffic: maintain a small pool of motes per hive, flowing both ways.
    // dir +1 = colony→hive (leaving), -1 = hive→colony (arriving). Density scales
    // gently with workers so a busy hive shows a slightly fuller highway.
    hv.traffic = hv.traffic || [];
    const want = Math.min(10, 3 + (hv.workers / 2 | 0));
    while (hv.traffic.length < want) hv.traffic.push({ u: Math.random(), dir: Math.random() < .5 ? 1 : -1, off: rng(-4, 4), spd: rng(.0006, .0011) });
    for (const m of hv.traffic) {
      m.u += m.spd * m.dir * dt;
      if (m.u > 1) { m.u = 0; m.dir = Math.random() < .55 ? -1 : 1; m.off = rng(-4, 4); }   // slight bias toward arriving
      else if (m.u < 0) { m.u = 1; m.dir = Math.random() < .55 ? -1 : 1; m.off = rng(-4, 4); }
    }

    // Cull a starved or far-flung hive.
    if (hv.mass < 20 || dst(P, hv) > 3200) hives.splice(i, 1);
  }
}

// Draw satellite hives — golden foragers linked home by a SUPPLY LINE (the
// tether) that couriers travel down to deliver mass. The tether brightens with a
// flowing dash when a courier is in transit, so its purpose reads at a glance.
function drawHives(ts) {
  for (const hv of hives) {
    // Supply line — a faint, calm thread (no bright pulsing). It's just the road.
    cx.strokeStyle = 'rgba(255,216,96,.10)';
    cx.lineWidth = .6;
    cx.beginPath(); cx.moveTo(hv.x, hv.y); cx.lineTo(P.x, P.y); cx.stroke();

    // Mini-highway: many tiny same-hue motes gliding along the tether. A subtle
    // tint tells leaving (cool gold) from arriving (warm gold). Slight perpendicular
    // offset gives a two-lane feel without reading as projectiles.
    if (hv.traffic) {
      const dx = P.x - hv.x, dy = P.y - hv.y, L = Math.hypot(dx, dy) || 1;
      const nx = -dy / L, ny = dx / L;                 // perpendicular (lane offset)
      for (const m of hv.traffic) {
        const px = hv.x + dx * m.u + nx * m.off;
        const py = hv.y + dy * m.u + ny * m.off;
        // arriving (dir -1, heading to colony) = brighter warm; leaving = dimmer cool
        cx.fillStyle = m.dir < 0 ? 'rgba(255,228,150,.85)' : 'rgba(225,200,130,.55)';
        cx.beginPath(); cx.arc(px, py, m.dir < 0 ? 1.5 : 1.2, 0, TAU); cx.fill();
      }
    }

    if (onScr(hv.x, hv.y, hv.r * 2)) {
      bioGlow(hv.x, hv.y, hv.r * 2.4, 'rgba(255,216,96,', .4);
      cx.fillStyle = '#FFD860'; cx.shadowBlur = 8 * zm; cx.shadowColor = '#FFD860';
      cx.globalAlpha = .85;
      cx.beginPath(); cx.arc(hv.x, hv.y, hv.r * (1 + .06 * Math.sin(hv.ph)), 0, TAU); cx.fill();
      // little orbiting forager specks
      cx.shadowBlur = 0; cx.fillStyle = '#fff'; cx.globalAlpha = .7;
      for (let k = 0; k < 4; k++) { const a = hv.ph * 1.5 + k * PI / 2; cx.beginPath(); cx.arc(hv.x + Math.cos(a) * hv.r * 1.4, hv.y + Math.sin(a) * hv.r * 1.4, 1.6, 0, TAU); cx.fill(); }
      cx.globalAlpha = 1; cx.shadowBlur = 0;
    }

    // Worker-count pip ring around the hive (shows it's staffed & growing).
    if (onScr(hv.x, hv.y, hv.r * 2) && hv.workers) {
      cx.fillStyle = '#9CF0FF'; cx.globalAlpha = .8;
      for (let k = 0; k < hv.workers; k++) {
        const a = -PI/2 + (k / 12) * TAU;
        cx.beginPath(); cx.arc(hv.x + Math.cos(a) * (hv.r + 5), hv.y + Math.sin(a) * (hv.r + 5), 1.3, 0, TAU); cx.fill();
      }
      cx.globalAlpha = 1;
    }
  }
}

// Lightweight neighbor query for cells (they're not in the org spatial hash).
// Small N (≤~80) so an O(n) scan per cell is fine and avoids a second grid.
function gNearCells(c, radius) {
  const out = [];
  for (const o of cells) { if (Math.abs(o.x - c.x) < radius && Math.abs(o.y - c.y) < radius) out.push(o); }
  return out;
}

// Draw food patches as soft nutrient clouds, and a directional chevron toward
// the nearest one with food (so the colony always has somewhere to go).
function drawColonyPatches(ts) {
  for (const p of patches) {
    if (!onScr(p.x, p.y, p.r * 1.2)) continue;
    const fill = cl(p.food / p.max, 0, 1);
    const grd = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    grd.addColorStop(0, `rgba(120,255,180,${.06 * fill + .02})`);
    grd.addColorStop(1, 'rgba(120,255,180,0)');
    cx.fillStyle = grd; cx.globalAlpha = .8 + .2 * Math.sin(p.ph);
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, TAU); cx.fill();
    cx.globalAlpha = 1;
  }
  // Directional marker: chevron at the screen edge / near the colony pointing to
  // the richest nearby patch the colony isn't already sitting in.
  let best = null, bestScore = -1;
  for (const p of patches) {
    if (p.food < 6) continue;
    const d = dst(P, p);
    if (d < p.r * 0.8) continue;                 // already harvesting it
    const sc = p.food / (d + 200);
    if (sc > bestScore) { bestScore = sc; best = p; }
  }
  if (best) {
    const a = ang(P, best), mr = P.r + 60;
    const mx = P.x + Math.cos(a) * mr, my = P.y + Math.sin(a) * mr;
    cx.save(); cx.translate(mx, my); cx.rotate(a);
    cx.globalAlpha = .5 + .3 * Math.sin(ts * .006);
    cx.strokeStyle = '#7CFFB4'; cx.lineWidth = 2; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(-6, -7); cx.lineTo(6, 0); cx.lineTo(-6, 7); cx.stroke();
    cx.restore(); cx.globalAlpha = 1;
  }
}

// Shape-specific structure that visibly GROWS with mass + cell count, drawn in
// world space at the colony centroid (P.x/P.y), oriented to colony heading.
// growth = sqrt(totalMass); n = cell count. Everything scales off these so the
// player SEES the colony getting bigger/more complex as it feeds.
function drawColonyStructure(ts, col, n, growth, cosH, sinH) {
  const cx0 = P.x, cy0 = P.y;
  const lift = (lx, ly) => ({ x: cx0 + lx * cosH - ly * sinH, y: cy0 + lx * sinH + ly * cosH });

  // Central biomass core — common to all shapes, scales with total mass.
  const coreR = cl(growth * 0.6, 6, 140);
  const gpref = 'rgba(' + parseInt(col.slice(1,3),16) + ',' + parseInt(col.slice(3,5),16) + ',' + parseInt(col.slice(5,7),16) + ',';
  bioGlow(cx0, cy0, coreR * 2.0, gpref, .35);
  cx.globalAlpha = .12; cx.fillStyle = col;
  cx.beginPath(); cx.arc(cx0, cy0, coreR, 0, TAU); cx.fill();
  cx.globalAlpha = 1;

  cx.strokeStyle = col; cx.lineCap = 'round';

  switch (colonyShape) {
    case 'plant': {
      // CORAL/TREE: recursive branches that gain COMPLEXITY the longer you stay
      // rooted (plantRootT ramp 0..1) — sub-branches sprout, depth increases, and
      // the whole thing reaches taller. Reads as "growing into the ideal form for
      // this spot." Branch count/height also scale with mass + cells.
      const ramp = plantRootT / PLANT_RAMP_MS;                    // 0..1 maturity
      const trunks = Math.min(20, 4 + (n / 5 | 0));
      const h = cl(growth * (1.0 + ramp * 0.9), 30, 480);          // taller as it matures
      const maxDepth = 1 + Math.round(ramp * 2.5);                 // 1 → up to ~3 levels
      const baseW = cl(growth * 0.05, 1, 8);
      // Recursive branch: draws a limb then forks into sub-limbs.
      const branch = (bx, by, ang0, len, w, depth, seed) => {
        const sway = Math.sin(ts * .0014 + seed) * 0.18 * (1 - depth / (maxDepth + 1));
        const tx = bx + Math.cos(ang0 + sway) * len;
        const ty = by + Math.sin(ang0 + sway) * len;
        cx.lineWidth = Math.max(0.6, w); cx.globalAlpha = .5;
        cx.beginPath(); cx.moveTo(bx, by); cx.lineTo(tx, ty); cx.stroke();
        if (depth >= maxDepth || len < 10) {
          cx.fillStyle = '#9CE84A'; cx.globalAlpha = .55 + .25 * Math.sin(ts*.005 + seed);
          cx.beginPath(); cx.arc(tx, ty, cl(growth*0.03, 1.2, 5), 0, TAU); cx.fill();
          return;
        }
        const spread = 0.5 + 0.25 * ramp;
        branch(tx, ty, ang0 - spread, len * 0.72, w * 0.66, depth + 1, seed + 1.7);
        branch(tx, ty, ang0 + spread, len * 0.72, w * 0.66, depth + 1, seed + 3.1);
      };
      for (let i = 0; i < trunks; i++) {
        const base = (i / Math.max(1,trunks-1) - 0.5) * coreR * 2.2;
        const b = lift(base, coreR * 0.3);
        // grow "up" = +y in colony-local; convert to world angle
        const up = lift(base, coreR * 0.3 + 10);
        const ang0 = Math.atan2(up.y - b.y, up.x - b.x);
        branch(b.x, b.y, ang0, h * (0.45 + 0.4 * ((i*37%13)/13)), baseW, 0, i * 2.3);
      }
      break;
    }
    case 'radial': {
      // BLOOM: spokes radiating out; more spokes + longer reach with mass.
      const spokes = Math.min(24, 6 + (n / 5 | 0));
      const reach = cl(growth * 1.1, 30, 360);
      cx.lineWidth = cl(growth * 0.04, 1, 5); cx.globalAlpha = .4;
      for (let i = 0; i < spokes; i++) {
        const a = (i / spokes) * TAU + ts * .0004;
        cx.beginPath(); cx.moveTo(cx0, cy0);
        cx.lineTo(cx0 + Math.cos(a) * reach, cy0 + Math.sin(a) * reach); cx.stroke();
      }
      cx.globalAlpha = .25; cx.lineWidth = cl(growth*0.03,1,4);
      cx.beginPath(); cx.arc(cx0, cy0, reach * 0.9, 0, TAU); cx.stroke();
      break;
    }
    case 'filament': {
      // NET: a thick connected ribbon broadside to travel; length grows with mass.
      const half = cl(growth * 1.6, 40, 520);
      cx.lineWidth = cl(growth * 0.10, 2, 16); cx.globalAlpha = .35;
      cx.beginPath();
      for (let t = -1; t <= 1.001; t += 0.1) {
        const bow = Math.sin((t * 0.5 + 0.5) * PI) * coreR * 0.5;
        const p = lift(bow, t * half);
        if (t <= -1) cx.moveTo(p.x, p.y); else cx.lineTo(p.x, p.y);
      }
      cx.stroke();
      break;
    }
    case 'dart': {
      // HULL: a streamlined teardrop pointing along heading; lengthens with mass.
      const len = cl(growth * 1.3, 30, 300), wid = cl(growth * 0.5, 12, 90);
      cx.globalAlpha = .3; cx.fillStyle = col;
      const nose = lift(len, 0), tl = lift(-len*0.5, -wid), tr = lift(-len*0.5, wid), tail = lift(-len*0.7, 0);
      cx.beginPath(); cx.moveTo(nose.x, nose.y);
      cx.quadraticCurveTo(tl.x, tl.y, tail.x, tail.y);
      cx.quadraticCurveTo(tr.x, tr.y, nose.x, nose.y); cx.fill();
      break;
    }
    // swarm: no rigid structure — its growth shows purely in cell count/size.
  }
  cx.globalAlpha = 1; cx.shadowBlur = 0;
}

// Render the swarm: soft connective haze + tissue links (reads as one organism)
// + bright cells. When bound into a shape the links trace the morphology — a
// filament looks like a net, a radial like a bloom.
function drawSwarm(ts) {
  if (microMode !== 'swarm' || !cells.length) return;
  const col = COL.titan.pri;
  // Connective membrane haze
  cx.globalCompositeOperation = 'lighter';
  cx.fillStyle = col;
  for (const c of cells) {
    cx.globalAlpha = .05;
    cx.beginPath(); cx.arc(c.x, c.y, c.r * 4.5, 0, TAU); cx.fill();
  }
  cx.globalCompositeOperation = 'source-over';

  // ── STRUCTURAL GROWTH overlay ──────────────────────────────────────────────
  // Make the colony VISIBLY grow with mass, not just have slightly bigger dots.
  // Each shape draws structure scaled by cell count + total mass: a central
  // biomass core for all, plus shape-specific organs (plant fronds, radial spokes,
  // a dart hull, a filament ribbon). This is the "forms must grow" feedback.
  const n = cells.length;
  const totalMass = cells.reduce((a, c) => a + c.mass, 0);
  const growth = Math.sqrt(totalMass);                 // single growth metric
  const cosH = Math.cos(colonyHd), sinH = Math.sin(colonyHd);
  drawColonyStructure(ts, col, n, growth, cosH, sinH);
  // Tissue links — thin lines between near cells, so the colony reads as connected
  // tissue rather than loose dots. Skipped for the loose swarm (it should look free).
  if (colonyShape !== 'swarm') {
    cx.strokeStyle = col; cx.lineWidth = .6; cx.globalAlpha = .18;
    const LINK = 46;
    for (let a = 0; a < cells.length; a++) {
      const ca = cells[a];
      for (const cb of gNearCells(ca, LINK)) {
        if (cb === ca) continue;
        cx.beginPath(); cx.moveTo(ca.x, ca.y); cx.lineTo(cb.x, cb.y); cx.stroke();
      }
    }
    cx.globalAlpha = 1;
  }
  // Cell bodies
  for (const c of cells) {
    cx.globalAlpha = .85;
    cx.fillStyle = col;
    cx.shadowBlur = 6 * zm; cx.shadowColor = col;
    cx.beginPath(); cx.arc(c.x, c.y, c.r * (1 + .12 * Math.sin(c.ph)), 0, TAU); cx.fill();
    cx.shadowBlur = 0;
    cx.globalAlpha = .9;
    cx.fillStyle = '#fff';
    cx.beginPath(); cx.arc(c.x - c.r * .25, c.y - c.r * .25, c.r * .32, 0, TAU); cx.fill();
  }
  cx.globalAlpha = 1; cx.shadowBlur = 0;
}

// The COLOSSUS pressure ring — a tightening, brightening halo that signals the
// singularity is approaching, then the pulsing "tap to divide" cue at full charge.
function drawBreakPressure(ts) {
  if (breakPressure <= 0 || microMode === 'swarm') return;
  const p = breakPressure;
  const baseR = P.r * (1.6 - .5 * p);                 // ring tightens as it charges
  cx.globalAlpha = .2 + .5 * p;
  cx.strokeStyle = '#9CF0FF'; cx.lineWidth = 1.5 + 2 * p;
  cx.shadowBlur = 16 * zm * p; cx.shadowColor = '#9CF0FF';
  cx.setLineDash([5, 6]); cx.lineDashOffset = -ts * .04;
  cx.beginPath(); cx.arc(P.x, P.y, baseR, 0, TAU); cx.stroke();
  cx.setLineDash([]);
  if (microMode === 'choice') {
    // Full charge: bright pulsing "divide" cue
    const pulse = .5 + .5 * Math.sin(ts * .006);
    cx.globalAlpha = .4 + .4 * pulse;
    cx.lineWidth = 2.5; cx.beginPath(); cx.arc(P.x, P.y, P.r * (1.15 + .08 * pulse), 0, TAU); cx.stroke();
  }
  cx.globalAlpha = 1; cx.shadowBlur = 0;
}

function checkEvo() {
  // THE SPINE: evolution needs the objective complete AND the mass threshold.
  // Mass alone is fuel; the objective is the story beat that earns the next form.
  if (P.stg < STAGES.length-1 && P.mass >= STAGES[P.stg+1].thr && objComplete()) {
    P.stg++;
    objProg = 0;         // the new stage's objective begins fresh
    if (P.stg === 4) spawnDomSites();   // PRIMORDIAL: dominion sites appear
    syncSeedTraits(P);   // grant this stage's default-path traits (e.g. bolt at PRIMORDIAL)
    const s=stg();
    const fl=document.getElementById('flash');
    fl.style.background=`radial-gradient(circle,${s.c.pri}40 0%,transparent 68%)`;
    fl.style.opacity='1'; setTimeout(()=>fl.style.opacity='0',500);
    document.getElementById('evoT').textContent=s.name; document.getElementById('evoT').style.color=s.c.pri;
    document.getElementById('evoS').textContent=s.desc;
    const ea=document.getElementById('evoAnn'); ea.style.opacity='1'; setTimeout(()=>ea.style.opacity='0',2400);
    burst(P.x,P.y,s.c.pri,45,5); ring(P.x,P.y,'#fff',P.r*2,18); shk(8,400); sfxEvo();
    // Phase boundary? Give it a bigger beat shortly after the stage announce.
    const ph = phaseStartingAt(P.stg);
    if (ph) setTimeout(() => announce(ph.name, ph.c, ph.sub, 4200), 2800);
    setStageAudio(P.stg);
    if(P.stg>=2) spawn('hunter',3);
    if(P.stg>=3){spawn('phantom',2);spawn('grazer',5);if(Math.random()<.5)spawn('echo',1);}
    // NAGA adaptation: hand the player the upgraded frenzy immediately by dropping
    // a pill right beside them, so the new wall-breaking frenzy is felt at once.
    if(P.stg===3 && !frenzy){ pill={x:P.x+rng(-260,260),y:P.y+rng(-260,260),r:9,on:true,cd:0}; }
    if(P.stg>=4){spawn('levia',2);spawn('behemoth',1);spawn('echo',1);spawn('grazer',3);}
    if(P.stg>=5) spawn('behemoth',2);

    // ── Adaptation choice: a beat after the evolution lands, offer a hand of
    //    trait cards. Skipped in the micro/swarm branch (it has its own systems). ──
    if (P.stg >= 1 && microMode === 'single') {
      setTimeout(() => { if (!paused && !introActive && microMode === 'single') openAdapt(P); }, 1200);
    }

    // ── Radar unlocks at Drifter (stg=1). Show a second tutorial panel 2.6s
    //    after the stage announcement fades, explaining what just appeared. ──
    if (P.stg === 1 && !radarTutorialShown) {
      radarTutorialShown = true;
      setTimeout(() => {
        const eT = document.getElementById('evoT');
        const eS = document.getElementById('evoS');
        const eAnn = document.getElementById('evoAnn');
        eT.textContent = 'RADAR ONLINE';
        eT.style.color = '#14D0FF';
        eS.textContent = 'Antennae sense prey, predators, and precision strikes.';
        eAnn.style.opacity = '1';
        setTimeout(() => { eAnn.style.opacity = '0'; }, 3200);
      }, 2700);
    }
  }
}

// ═══════════════════════════════════════════
// FRENZY POWER — scales with evolution
// ═══════════════════════════════════════════
// Pre-NAGA the frenzy is a pleasant burst. From NAGA (stg 3) on it becomes a
// genuine mass-wall breaker: it lasts longer, pulls food from a wider radius,
// relaxes the eat threshold enough to swallow same-size (and slightly larger)
// prey, and pays out on a steeper kill-streak multiplier.
const FRENZY_BASE = 8000;
function frenzyDur()       { return P.stg >= 3 ? 11000 : FRENZY_BASE; }
function frenzyEatRatio()  { return P.stg >= 3 ? 1.08 : 0.95; }   // >1 ⇒ can eat slightly-larger prey
function frenzyVortexRng() { return 320 + P.stg * 45; }            // NAGA 455 · TITAN 500 · PRIMO 545
function frenzyGainMul()   {
  const base = P.stg >= 3 ? 2.1 : 1.5;
  const step = P.stg >= 3 ? 0.22 : 0.15;
  return base + Math.min(streak, 12) * step;                       // NAGA: up to ~4.7×
}
function frenzyCap()       { return P.stg >= 3 ? 16000 : 12000; }  // max extended duration

// ═══════════════════════════════════════════
// COLLISIONS
// ═══════════════════════════════════════════
function collide(dt) {
  // Grasping Arms extend your effective eat reach via traitStats.reach.
  const reachStat = traitStats(P).reach;
  const nearP=gNear(P.x,P.y,Math.max(P.r*2*reachStat,80));
  // Frenzy expands eat range AND relaxes the threshold so you can punch up
  const eatReachMul = (frenzy ? 1.3 : 1.05) * reachStat;
  for (let i=nearP.length-1; i>=0; i--) {
    const o=nearP[i]; if(!orgs.includes(o))continue;
    const d=dst(P,o);

    // Frenzy: temporarily relaxed eat threshold (.95 vs .8 normal)
    const frenzyEdible = frenzy && (o.r < P.r * frenzyEatRatio());
    if ((canEat(o) || canEatAngle(o) || frenzyEdible)&&d<P.r*eatReachMul) {
      const T=ORGS[o.type], angleKill = !canEat(o) && !frenzyEdible && canEatAngle(o);
      let gain=killReward(T.mass*(o.massMul||1), o.mhp, P.mass);   // one reward function
      if (angleKill) gain *= 1.6;                              // precision bonus
      if (frenzy) gain *= frenzyGainMul();  // stage-scaled combo multiplier (up to ~4.7× at NAGA)
      P.mass+=gain; score+=Math.floor(gain*8); streak++; streakT = frenzy ? 1500 : 2500;
      // The Spine: feed the objective engine + the living world.
      objBump('eat');
      if (angleKill) objBump('precision');
      if (o.mhp >= 8) objBump('apex');                 // hunter-class or tougher
      applySelection(o);                               // survivors breed
      dropDetritus(o.x, o.y, T.mass * .3);             // kills feed the nutrient cycle
      burst(o.x,o.y,T.col,angleKill?14:8,angleKill?2.6:1.8);
      if (angleKill) { ring(o.x,o.y,'#ffd860',o.r*1.4,14); fTxt(o.x,o.y-24,'PRECISION','#ffd860'); }
      fTxt(o.x,o.y-10,'+'+Math.floor(gain),T.col);
      if (streak>2) fTxt(o.x,o.y-(angleKill?38:24),streak+'×','rgba(255,255,255,.4)');
      shk(.6+o.r*.06+(angleKill?1.5:0),50+(angleKill?80:0));
      if (angleKill) sfxPrecision(); else sfxEat();
      audioFilterPulse(STAGE_CUTOFF[P.stg]*1.6, .15);

      // Frenzy chain pulse — stun and damage nearby creatures, extend frenzy duration
      if (frenzy) {
        fTime = Math.min(frenzyCap(), fTime + 250);  // each kill extends the frenzy
        ring(o.x, o.y, '#40c8f0', 60, 14);
        for (const n of gNear(o.x, o.y, 80)) {
          if (n === o || !orgs.includes(n)) continue;
          n.stunT = Math.max(n.stunT||0, 350);
          if (canEat(n)) n.hp = 0; // gentle kill on small fry
        }
      }

      const idx=orgs.indexOf(o); if(idx>=0)orgs.splice(idx,1);
      const cnt=orgs.filter(q=>q.type===o.type).length;
      if (cnt<ORGS[o.type].mx) setTimeout(()=>spawn(o.type,1),rng(1500,4000));
      checkEvo(); continue;
    }
    if (isPred(o)&&d<o.r&&P.blink<=0&&!shOn) {
      // Frenzy = glass cannon: take 1.5× damage during the window.
      // Defense traits (membrane) reduce damage taken via traitStats.
      const dmgMul = (frenzy ? 1.5 : 1) * traitStats(P).dmgTaken;
      P.mass=Math.max(5,P.mass-ORGS[o.type].mass*.08*dmgMul*(dt/16)); P.blink=250;
      shk(2.5,80); burst(P.x,P.y,'#ff2244',4,1.2); sfxHurt();
      if (P.stg>0&&P.mass<STAGES[P.stg].thr*.55) {
        P.stg=Math.max(0,P.stg-1);
        // A stage you've already earned stays earned — its objective is marked
        // complete so de-evolution can't soft-lock (e.g. beacons already charted).
        objProg = objDef() ? objDef().n : 0;
        fTxt(P.x,P.y-28,'DE-EVOLVED','#ff4444'); shk(6,300); setStageAudio(P.stg); audioBend(-4,1.2);
      }
    }
    if (o.hp<=0) {
      const T=ORGS[o.type];
      const gain = killReward(T.mass*(o.massMul||1), o.mhp, P.mass) * 1.2;  // damage-kill bounty
      P.mass+=gain; score+=Math.floor(gain*5);
      // The Spine: objectives + the living world.
      if (o.mhp >= 8) objBump('apex');
      applySelection(o);
      dropDetritus(o.x, o.y, T.mass * .4);
      const apex = o.mhp >= 30;                     // levia/behemoth-class takedown
      burst(o.x,o.y,T.col, apex?34:12, apex?4:2.5);
      fTxt(o.x,o.y-10,'+'+Math.floor(gain),T.col);
      if (apex) {
        ring(o.x,o.y,'#fff',o.r*1.6,22); ring(o.x,o.y,T.col,o.r*2.4,18);
        fTxt(o.x,o.y-30,'APEX SLAIN','#fff'); shk(6,360);
        streak++; streakT=3000;
        try { sfxAnomalyGrab(); } catch(e) { try{ sfxEvo(); }catch(_){} }
      } else { try { sfxEat(); } catch(e){} }
      traitOnKill(P, o);   // venom procs, lifesteal, etc. (engine hook)
      const idx=orgs.indexOf(o); if(idx>=0)orgs.splice(idx,1); checkEvo();
    }
  }

  // Projectiles
  for (let i=projs.length-1; i>=0; i--) {
    const p=projs[i]; p.x+=p.vx; p.y+=p.vy; p.life-=16;
    if (parts.length<240) parts.push({x:p.x,y:p.y,vx:rng(-.15,.15),vy:rng(-.15,.15),r:rng(.5,2),life:140,ml:140,c:p.c,t:'c'});
    if (p.life<=0){projs.splice(i,1);continue;}
    for (const o of gNear(p.x,p.y,30)) { if(dst(p,o)<o.r+p.r){o.hp-=p.dmg;o.flT=180;o.stunT=300;o.vx+=p.vx*.3;o.vy+=p.vy*.3;burst(p.x,p.y,p.c,6,1.5);projs.splice(i,1);break;} }
  }

  // ═══════════════════════════════════════════
  // FRENZY — A true feeding frenzy. Edible food in a wide radius gets pulled
  // into orbit around the player, creating a visible swirling feast. The food
  // gets eaten naturally when it touches you. The closer/longer they orbit,
  // the more food converges. Skillful movement (staying still as food gathers,
  // then sweeping through it) maximizes the feast.
  //
  // During frenzy:
  //   • Edible food (canEat smaller creatures) gets pulled into orbit (radius up to 320px)
  //   • Pull strength increases as food gets closer — they spiral inward
  //   • Eat reach +30%, eat threshold relaxed (up to 0.95× player size)
  //   • Each kill extends frenzy by 200ms (rewards sustained feasting)
  //   • Mass-gain multiplier scales with kill streak (1.5× → 3× cap)
  //   • Movement +40% (already in updateP)
  //   • Predators do 1.5× damage to you (glass cannon trade-off)
  //
  // Duration: 8 seconds base, extends with kills.
  // ═══════════════════════════════════════════
  if (pill.on&&dst(P,pill)<P.r+pill.r) {
    P.flash={c:'#40c8f0',t:280}; frenzy=true; fTime=frenzyDur(); fMax=fTime; pill.on=false; sfxFrenzy();
    audioSetFrenzy(true); audioFilterPulse(STAGE_CUTOFF[P.stg]*1.8, .8);
    burst(pill.x,pill.y,'#40c8f0',24,3.5); ring(P.x,P.y,'#40c8f0',P.r*3.5,16); shk(2.5,160);
    fTxt(P.x, P.y-40, 'FEEDING FRENZY', '#40c8f0');

    // First-time tutorial
    if (!frenzyTutorialShown) {
      frenzyTutorialShown = true;
      document.getElementById('evoT').textContent = 'FEEDING FRENZY';
      document.getElementById('evoT').style.color = '#40c8f0';
      document.getElementById('evoS').textContent = 'Food spirals toward you. Eat fast. Each kill extends the frenzy.';
      const ea = document.getElementById('evoAnn');
      ea.style.opacity = '1';
      setTimeout(() => { ea.style.opacity = '0'; }, 3200);
    }
  }
  if (frenzy) {
    fTime -= dt;
    if (fTime <= 0) {
      frenzy = false; audioSetFrenzy(false);
      fTxt(P.x, P.y-30, 'frenzy fades', 'rgba(64,200,240,.5)');
      // Release any organisms still caught in the vortex
      for (const o of orgs) o._vortex = 0;
    } else {
      // ── Apply vortex pull to edible food within range ──
      // The food itself becomes the visual — they swirl into the player.
      const VORTEX_RANGE = frenzyVortexRng();
      const pullRatio = frenzyEatRatio();
      for (const o of gNear(P.x, P.y, VORTEX_RANGE)) {
        if (o.r >= P.r * pullRatio) continue;  // pull everything the frenzy can actually swallow
        const d = dst(P, o);
        if (d < 3) continue;
        if (d > VORTEX_RANGE) continue;

        const t = 1 - d/VORTEX_RANGE;     // strength rises as food nears player
        const a = ang(o, P);              // angle from food toward player
        const radial = .25 + t * .85;     // radial pull (gets stronger inward)
        const swirl  = .55 * t;           // tangential swirl creates orbit

        o.vx += Math.cos(a) * radial;
        o.vy += Math.sin(a) * radial;
        o.vx += Math.cos(a + PI/2) * swirl;
        o.vy += Math.sin(a + PI/2) * swirl;

        // Velocity cap so they spiral inward smoothly, not slingshot
        const v = Math.hypot(o.vx, o.vy);
        const VMAX = 7;
        if (v > VMAX) { o.vx = o.vx/v*VMAX; o.vy = o.vy/v*VMAX; }

        // Tag for visual streak trail and accelerated decay
        o._vortex = t;                    // 0..1 intensity for renderer
      }
    }
  }
  // Pills arrive ~twice as often from NAGA on, so the stronger frenzy is actually
  // reachable when the mass wall bites.
  const pillBase = P.stg >= 3 ? 11000 : 22000, pillRand = P.stg >= 3 ? 5000 : 8000;
  if (!pill.on&&!frenzy) { pill.cd+=dt; if(pill.cd>pillBase+rng(0,pillRand)){pill={x:P.x+rng(-600,600),y:P.y+rng(-600,600),r:9,on:true,cd:0};} }

  // Shield
  if (shld.on&&dst(P,shld)<P.r+shld.r) { P.flash={c:'#e8c040',t:400}; shOn=true; shTime=5000; shld.on=false; sfxEat(); burst(shld.x,shld.y,'#e8c040',12,2); shk(2,100); }
  if (shOn) { shTime-=dt; if(shTime<=0)shOn=false; }
  if (!shld.on&&!shOn) { shld.cd+=dt; if(shld.cd>25000+rng(0,10000)){shld={x:P.x+rng(-600,600),y:P.y+rng(-600,600),r:9,on:true,cd:0};} }

  // Beacons
  // Beacons — the DRIFTER explore objective: each beacon is visited once and
  // marks itself; the set stays up (dim) as a record of the charted dark.
  for (const b of beacons) {
    if (!b.hit && dst(P,b) < P.r + b.r + 8) {
      b.hit = true;
      burst(b.x,b.y,'#fff',14,2.4); ring(b.x,b.y,'#9CF0FF',60,16); shk(2,80);
      fTxt(b.x, b.y-22, 'BEACON CHARTED', '#9CF0FF');
      objBump('explore');
      try { sfxRadarPing(); } catch(e) {}
    }
  }

  // ═════════════════════════════════════════════════════════════
  // ANOMALIES — high-mass nutrient pods that orbit large predators.
  // High risk (must get close to a predator) for high reward.
  // Mass values scale with host's threat; reward is proportional.
  // ═════════════════════════════════════════════════════════════
  updateAnomalies(dt);
}

const ANOM_HOSTS = {
  hunter:   { mass: 42,  col: '#ff5878', gl: 'rgba(255,88,120,' },   // was 28
  lurker:   { mass: 58,  col: '#ffaa40', gl: 'rgba(255,170,64,' },   // was 38
  phantom:  { mass: 54,  col: '#e060ff', gl: 'rgba(224,96,255,' },   // was 34
  levia:    { mass: 85,  col: '#60c8ff', gl: 'rgba(96,200,255,' },   // was 52
  behemoth: { mass: 130, col: '#ff3030', gl: 'rgba(255,48,48,' },    // was 78
};

function spawnAnomaly() {
  // Pick a random eligible predator within reasonable range that isn't already a host
  const candidates = orgs.filter(o => ANOM_HOSTS[o.type] && !anoms.some(a => a.host === o));
  if (!candidates.length) return false;
  const host = candidates[rni(0, candidates.length)];
  const cfg = ANOM_HOSTS[host.type];
  anoms.push({
    host,
    orbAng: Math.random()*TAU,
    orbR: host.r + 30 + rng(0,12),
    orbSpd: rng(.0008, .0016) * (Math.random()<.5 ? 1 : -1),
    x: host.x, y: host.y,
    r: 7, mass: cfg.mass, col: cfg.col, gl: cfg.gl,
    life: rng(18000, 26000),
    ph: rng(0, TAU),
    freeT: 0,
  });
  return true;
}

function updateAnomalies(dt) {
  anomCd -= dt;
  // Spawn cadence scales with stage. Medusa (stg=2) gets a generous 3 anomalies
  // to ease the difficulty wall the user identified at ~500 mass. After Naga
  // settles at 2-3 since you have abilities to compensate.
  const wantedCount = P.stg < 2 ? 1 : (P.stg === 2 ? 3 : P.stg < 5 ? 2 : 3);
  // Faster cadence at Medusa specifically
  const cdMin = P.stg === 2 ? 6000 : 9000;
  const cdRand = P.stg === 2 ? 5000 : 7000;
  if (anomCd <= 0 && anoms.length < wantedCount) {
    if (spawnAnomaly()) anomCd = cdMin + rng(0, cdRand);
    else anomCd = 2500;
  }

  for (let i = anoms.length - 1; i >= 0; i--) {
    const a = anoms[i];
    a.life -= dt; a.ph += dt * .004;

    if (a.host && orgs.includes(a.host)) {
      // Orbit the host
      a.orbAng += a.orbSpd * dt;
      a.x = a.host.x + Math.cos(a.orbAng) * a.orbR;
      a.y = a.host.y + Math.sin(a.orbAng) * a.orbR;
    } else {
      // Host died — anomaly drifts free briefly, then dissipates
      a.host = null;
      a.freeT += dt;
      a.x += Math.cos(a.orbAng) * .15 * dt * .016;
      a.y += Math.sin(a.orbAng) * .15 * dt * .016;
      if (a.freeT > 4000) { anoms.splice(i, 1); continue; }
    }

    // Cull if expired or far from player
    if (a.life <= 0 || dst(P, a) > 2400) {
      anoms.splice(i, 1); continue;
    }

    // Player collision — big reward
    if (dst(P, a) < P.r + a.r) {
      // Payout scales with BOTH the fixed pod mass and a % of current mass, so an
      // anomaly is always a meaningful score even in the lategame (the old flat
      // 42–130 was rounding error at 5000+ mass — the player's "fruitless" note).
      const reward = a.mass + P.mass * 0.06;
      P.mass += reward; score += Math.floor(reward * 18); streak += 3; streakT = 4000;
      // And it DOES something special: triggers/extends a feeding frenzy — the
      // radar hunt now pays off with a power window, not just a snack.
      frenzy = true; fTime = Math.min(frenzyCap(), (frenzy ? fTime : 0) + 6000); fMax = Math.max(fMax, fTime);
      try { audioSetFrenzy(true); sfxAnomalyGrab(); } catch(e){}
      burst(a.x, a.y, a.col, 34, 4.5);
      ring(a.x, a.y, a.col, 48, 26);
      ring(a.x, a.y, '#fff', 28, 16);
      ring(a.x, a.y, '#40c8f0', P.r*2, 20);
      fTxt(a.x, a.y - 16, '+' + Math.floor(reward), a.col);
      fTxt(a.x, a.y - 34, 'ANOMALY · FRENZY', '#40c8f0');
      shk(4, 220);
      sfxAnomalyGrab();
      anoms.splice(i, 1);
      checkEvo();
    }
  }
}

function ecoCollide() {
  let kills=0;
  for (let i=orgs.length-1; i>=0&&kills<5; i--) {
    const a=orgs[i]; if(!a)continue; const pp=PREY_OF[a.type]; if(!pp)continue;
    for (const b of gNear(a.x,a.y,a.r*2)) {
      if (b===a||!pp.includes(b.type)||b.r>=a.r*.8) continue;
      if (dst(a,b)<a.r+b.r*.3) {
        a.r=Math.min(a.r*1.02,ORGS[a.type].maxR*1.1);
        burst(b.x,b.y,ORGS[b.type].col,5,1.2);
        dropDetritus(b.x, b.y, ORGS[b.type].mass * .2);   // nature feeds the cycle too
        const idx=orgs.indexOf(b); if(idx>=0)orgs.splice(idx,1); if(idx<i)i--;
        const cnt=orgs.filter(q=>q.type===b.type).length;
        if (cnt<ORGS[b.type].mx) setTimeout(()=>spawn(b.type,1),rng(2000,5000));
        kills++; break;
      }
    }
  }
}

// ═══════════════════════════════════════════
// RENDERING HELPERS
// ═══════════════════════════════════════════
function onScr(x, y, r) {
  const hw=W/(2*zm), hh=H/(2*zm);
  return x+r>P.x-hw && x-r<P.x+hw && y+r>P.y-hh && y-r<P.y+hh;
}

function bioGlow(x, y, r, gl, a) {
  if (!onScr(x,y,r*1.5)) return;
  // Defensive: gl must be an rgba prefix like 'rgba(82,255,202,' to which we
  // append '.1)' etc. If it's a hex color, addColorStop would throw and abort
  // the entire frame's render pipeline. Validate and short-circuit safely.
  if (typeof gl !== 'string' || gl.indexOf('rgba(') !== 0 || gl.charAt(gl.length-1) !== ',') return;
  try {
    cx.globalAlpha = a;
    // Richer falloff: a brighter hot core that fades through a wide soft skirt,
    // giving creatures a luminous, lensed presence instead of a flat haze.
    const g = cx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0,   gl + '.16)');
    g.addColorStop(.28, gl + '.08)');
    g.addColorStop(.62, gl + '.025)');
    g.addColorStop(1,   gl + '0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x, y, r, 0, TAU); cx.fill();
  } catch(e) { /* fail silent — never let a glow abort the frame */ }
  cx.globalAlpha = 1;
}

// ═══════════════════════════════════════════
// BLOOM — layered additive glow post-process
// ═══════════════════════════════════════════
// Two-level downsample → additive composite. The frame is shrunk to ¼ and ⅛
// resolution (the browser's bilinear filter does the blurring for free), then
// both buffers are drawn back over the scene with 'lighter'. The tight ¼ buffer
// hugs bright edges; the wide ⅛ buffer throws a soft halo. On the near-black
// nebula backdrop the additive bias on dark pixels is negligible, so only the
// neon biology, projectiles, radar and frenzy effects actually bloom — giving the
// whole game a luminous, lensed feel for the cost of four drawImage calls/frame.
const bloomA = document.createElement('canvas'), bxA = bloomA.getContext('2d');
const bloomB = document.createElement('canvas'), bxB = bloomB.getContext('2d');
let bloomOn = true;
function applyBloom() {
  if (!bloomOn) return;
  const w4 = Math.max(1, W >> 2), h4 = Math.max(1, H >> 2),
        w8 = Math.max(1, W >> 3), h8 = Math.max(1, H >> 3);
  if (bloomA.width !== w4) { bloomA.width = w4; bloomA.height = h4; }
  if (bloomB.width !== w8) { bloomB.width = w8; bloomB.height = h8; }

  // Downsample the rendered frame: full → ¼ → ⅛
  bxA.globalCompositeOperation = 'source-over'; bxA.globalAlpha = 1; bxA.imageSmoothingEnabled = true;
  bxA.clearRect(0, 0, w4, h4); bxA.drawImage(G, 0, 0, w4, h4);
  bxB.globalCompositeOperation = 'source-over'; bxB.globalAlpha = 1; bxB.imageSmoothingEnabled = true;
  bxB.clearRect(0, 0, w8, h8); bxB.drawImage(bloomA, 0, 0, w8, h8);

  // Composite the blurred buffers back additively at full size
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.imageSmoothingEnabled = true;
  cx.globalCompositeOperation = 'lighter';
  cx.globalAlpha = .42; cx.drawImage(bloomA, 0, 0, W, H);
  cx.globalAlpha = .36; cx.drawImage(bloomB, 0, 0, W, H);
  cx.globalCompositeOperation = 'source-over';
  cx.globalAlpha = 1;
}

// ═══════════════════════════════════════════
// STATIC BACKGROUND
// ═══════════════════════════════════════════
const nebCanvas=document.createElement('canvas'); nebCanvas.width=nebCanvas.height=1024;
(()=>{
  const nc=nebCanvas.getContext('2d');
  nc.fillStyle='#00050e'; nc.fillRect(0,0,1024,1024);
  // Layer 1 — broad faint colored clouds (the bed). Richer palette + multi-stop
  // gradients give the deep-space backdrop real depth instead of flat tint.
  [
    {x:120,y:90, r:340,c:'rgba(0,42,82,.075)', c2:'rgba(0,20,48,.03)'},
    {x:800,y:160,r:300,c:'rgba(58,0,76,.055)', c2:'rgba(28,0,44,.025)'},
    {x:300,y:600,r:400,c:'rgba(0,36,68,.08)',  c2:'rgba(0,18,40,.03)'},
    {x:70, y:800,r:240,c:'rgba(46,30,0,.05)',  c2:'rgba(24,14,0,.02)'},
    {x:750,y:750,r:300,c:'rgba(0,56,50,.05)',  c2:'rgba(0,28,26,.02)'},
    {x:500,y:300,r:230,c:'rgba(18,0,52,.04)',  c2:'rgba(8,0,28,.02)'},
    {x:560,y:880,r:200,c:'rgba(52,0,40,.04)',  c2:'transparent'},
  ].forEach(b=>{
    const g=nc.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,b.c); g.addColorStop(.5,b.c2||'transparent'); g.addColorStop(1,'transparent');
    nc.fillStyle=g; nc.fillRect(0,0,1024,1024);
  });
  // Layer 2 — small dense "cores" with a hot center, like distant nebula knots.
  nc.globalCompositeOperation='lighter';
  [
    {x:300,y:600,r:90, c:'rgba(40,120,200,.10)'},
    {x:800,y:160,r:70, c:'rgba(150,70,200,.08)'},
    {x:120,y:90, r:64, c:'rgba(40,150,170,.07)'},
    {x:750,y:760,r:60, c:'rgba(40,200,160,.06)'},
  ].forEach(b=>{
    const g=nc.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,b.c); g.addColorStop(1,'transparent');
    nc.fillStyle=g; nc.fillRect(0,0,1024,1024);
  });
  nc.globalCompositeOperation='source-over';
  // Fine grain so gradient banding dissolves.
  const id=nc.getImageData(0,0,1024,1024);
  for (let i=0; i<id.data.length; i+=4) { const n=(Math.random()-.5)*4; id.data[i]+=n; id.data[i+1]+=n; id.data[i+2]+=n; }
  nc.putImageData(id,0,0);
})();

const stars=[];
for (let i=0; i<210; i++) {
  // ~1 in 9 is a "hero" star — larger, with the cross-flare treatment in drawBg.
  const hero = (i % 9 === 0);
  stars.push({
    x:rng(-4500,4500), y:rng(-4500,4500),
    s: hero ? rng(1.2,2.0) : rng(.16,1.0),
    dp:rng(.03,.14), tw:rng(.3,2.2), ph:rng(0,TAU),
    c:['#c8d8f0','#f0dcc0','#e0c4dc','#c0e8e0','#fff','#a8c8ff','#ffe6c0'][rni(0,7)]
  });
}

const LANDMARKS=[];
for (let i=0; i<22; i++) {
  const sd=i*8191+3571;
  LANDMARKS.push({
    x:((sd*13)%2600)-1300, y:((sd*17)%2600)-1300, s:3+((sd>>3)%5),
    rocks:Array.from({length:3+((sd>>5)%3)},(_,k)=>({a:((sd+k*311)%628)*.01,d:rng(.25,.4),r:rng(.45,.6)}))
  });
}

// ═══════════════════════════════════════════
// DRAW BACKGROUND
// ═══════════════════════════════════════════
function drawBg(ts) {
  const tl=1024, ox=(-P.x*.02)%tl, oy=(-P.y*.02)%tl;
  cx.globalAlpha=.55;
  for (let nx=-1; nx<=Math.ceil(W/tl)+1; nx++)
    for (let ny=-1; ny<=Math.ceil(H/tl)+1; ny++)
      cx.drawImage(nebCanvas, ox+nx*tl, oy+ny*tl, tl, tl);
  cx.globalAlpha=1;

  // Parallax stars — twinkle, with cross-flares + soft halo on the brightest.
  for (const s of stars) {
    const sx=(s.x-P.x*s.dp)*zm+off.x+shx, sy=(s.y-P.y*s.dp)*zm+off.y+shy;
    if (sx<-8||sx>W+8||sy<-8||sy>H+8) continue;
    const twinkle=.18+.82*(.5+.5*Math.sin(ts*s.tw*.001+s.ph));
    cx.fillStyle=s.c;
    if (s.s>1.05) {
      // bright star: soft glow halo + diffraction spikes that breathe with twinkle
      const fl=s.s*(2.0+twinkle*1.6);
      cx.globalAlpha=twinkle*.30;
      cx.fillRect(sx-fl,sy-.22,fl*2,.44); cx.fillRect(sx-.22,sy-fl,.44,fl*2);
      cx.globalAlpha=twinkle*.10;
      cx.beginPath(); cx.arc(sx,sy,s.s*1.6,0,TAU); cx.fill();
    }
    cx.globalAlpha=twinkle*.55;
    cx.fillRect(sx,sy,s.s*.7,s.s*.7);
  }
  cx.globalAlpha=1;
}

// ═══════════════════════════════════════════
// DRAW GRID + LANDMARKS
// ═══════════════════════════════════════════
function drawGrid() {
  // Fine grid
  cx.lineWidth=.22;
  for (let i=-18;i<=18;i++) for (let j=-18;j<=18;j++) {
    const x=i*50,y=j*50; if(!onScr(x,y,55))continue;
    const dd=Math.hypot(x+25-P.x,y+25-P.y), f=Math.max(0,1-dd/360); if(f<.01)continue;
    cx.strokeStyle=`rgba(14,26,44,${.055*f})`; cx.beginPath(); cx.rect(x,y,50,50); cx.stroke();
  }
  // Major grid
  cx.lineWidth=.45;
  for (let i=-9;i<=9;i++) for (let j=-9;j<=9;j++) {
    const x=i*200,y=j*200; if(!onScr(x,y,280))continue;
    const dd=Math.hypot(x+100-P.x,y+100-P.y), f=Math.max(0,1-dd/850);
    cx.strokeStyle=`rgba(20,38,60,${.1*f+.012})`; cx.beginPath(); cx.rect(x,y,200,200); cx.stroke();
  }
  // Landmarks
  for (const lm of LANDMARKS) {
    if (!onScr(lm.x,lm.y,lm.s*6)) continue;
    const dd=Math.hypot(lm.x-P.x,lm.y-P.y); if(dd>720)continue;
    const fade=Math.max(0,1-dd/720);
    for (const rk of lm.rocks) {
      cx.globalAlpha=fade*.07;
      cx.fillStyle=`rgba(12,20,32,1)`;
      cx.beginPath(); cx.ellipse(lm.x+Math.cos(rk.a)*lm.s*rk.d,lm.y+Math.sin(rk.a)*lm.s*rk.d,lm.s*rk.r,lm.s*rk.r*.6,rk.a,0,TAU); cx.fill();
    }
    cx.globalAlpha=1;
  }
  // Distance rings
  cx.strokeStyle='rgba(18,34,50,.038)'; cx.lineWidth=.45;
  for (let ri=1;ri<=4;ri++) { const rr=ri*400; if(!onScr(0,0,rr+60))continue; cx.beginPath();cx.arc(0,0,rr,0,TAU);cx.stroke(); }
}

// ═══════════════════════════════════════════
// DRAW DUST
// ═══════════════════════════════════════════
function drawDust(ts) {
  while (dust.length<55) dust.push({x:P.x+rng(-W/zm,W/zm),y:P.y+rng(-H/zm,H/zm),s:rng(.15,.9),vx:rng(-.03,.03),vy:rng(-.03,.03),a:rng(.009,.045),ph:rng(0,TAU),h:rng(0,1)});
  const sc=stg().c.pri;
  cx.globalCompositeOperation='lighter';
  for (const d of dust) {
    d.x+=d.vx; d.y+=d.vy;
    if (!onScr(d.x,d.y,5)) { d.x=P.x+rng(-W/zm,W/zm); d.y=P.y+rng(-H/zm,H/zm); }
    const tw=d.a*(.4+.6*Math.sin(ts*.001+d.ph));
    // Most motes are cool blue-white; a fraction pick up the current stage hue,
    // tying the ambient drift to the player's evolution. Additive = soft float.
    cx.fillStyle = d.h<.78 ? `rgba(168,204,242,${tw})` : sc;
    cx.globalAlpha = d.h<.78 ? 1 : tw*1.4;
    cx.beginPath(); cx.arc(d.x,d.y,d.s,0,TAU); cx.fill();
  }
  cx.globalCompositeOperation='source-over'; cx.globalAlpha=1;
}

// ═══════════════════════════════════════════
// DRAW ORGANISMS (NPCs)  — improved detail
// ═══════════════════════════════════════════
function drawCreature(o, ts) {
  const T=ORGS[o.type]; if(!onScr(o.x,o.y,o.r*2.8))return;

  // ── Level of detail ──────────────────────────────────────────────────────
  // When the world is zoomed far out (macro/COLOSSUS scale) a creature is only a
  // few screen pixels — drawing the full detailed body (gradients, trails, eyes,
  // shadow blur) for ~240 of them melts mobile GPUs. Below a screen-size cut we
  // draw a single cheap dot instead. Same silhouette colour, near-zero cost.
  const screenR = o.r * zm;
  if (screenR < 6) {
    const fl0 = o.flT > 0;
    cx.globalAlpha = fl0 ? 0.95 : 0.78;
    cx.fillStyle = fl0 ? '#fff' : T.col;
    cx.beginPath(); cx.arc(o.x, o.y, Math.max(o.r * 0.7, 2.2 / zm), 0, TAU); cx.fill();
    cx.globalAlpha = 1;
    return;
  }

  const dd=dst(P,o), fl=o.flT>0;
  const col = fl ? '#fff' : T.col;
  const dim = fl ? '#888' : T.dim;
  const breath = 1 + .038*Math.sin(o.breathPh);
  const r = o.r * breath;
  const gl = `rgba(${parseInt(T.col.slice(1,3),16)},${parseInt(T.col.slice(3,5),16)},${parseInt(T.col.slice(5,7),16)},`;

  bioGlow(o.x, o.y, r*2.8, gl, .28+.08*Math.sin(o.breathPh*2));

  // Trail
  for (const t of o.trail) {
    cx.fillStyle=dim; cx.globalAlpha=(t.l/250)*.05;
    cx.beginPath(); cx.arc(t.x,t.y,r*.18*(t.l/250),0,TAU); cx.fill();
  }

  // Stun rings
  if (o.stunT>0) {
    cx.strokeStyle='rgba(255,248,160,.14)'; cx.lineWidth=.5;
    for (let si=0;si<3;si++) { const sa=ts*.01+si*TAU/3; cx.beginPath(); cx.arc(o.x,o.y,r*1.12,sa,sa+.22); cx.stroke(); }
  }

  cx.save();
  cx.translate(o.x, o.y);
  cx.rotate(o.hd);
  // EVOLUTION MADE VISIBLE: fast genes read as sleek — the body stretches along
  // its heading and slims across it. After a few generations of selection you can
  // SEE that this population has gotten quicker (or lazier).
  if (o.gen && Math.abs(o.gen.spd - 1) > .04) {
    const sleek = cl((o.gen.spd - 1) * .55, -.18, .25);
    cx.scale(1 + sleek, 1 - sleek * .5);
  }
  cx.shadowBlur=5*zm; cx.shadowColor=dim;

  switch (o.type) {

    case 'echo': {
      cx.rotate(-o.hd);
      cx.globalCompositeOperation='lighter';
      for (let i=0;i<3;i++) { cx.globalAlpha=.05; cx.fillStyle=`hsla(${185+i*40},75%,58%,.1)`; cx.beginPath(); cx.arc(Math.sin(ts*.008+i)*4,Math.cos(ts*.008+i)*4,r*(1.1+i*.17),0,TAU); cx.fill(); }
      cx.globalCompositeOperation='source-over';
      cx.fillStyle='rgba(215,238,248,.55)'; cx.globalAlpha=.65;
      cx.beginPath();
      for (let a=0;a<TAU;a+=.18) { const rr=r+Math.sin(a*4+ts*.01)*1.8+Math.sin(a*7+ts*.006)*1.2; cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); }
      cx.closePath(); cx.fill();
      // Mirror shimmer
      cx.strokeStyle='rgba(64,220,240,.35)'; cx.lineWidth=.6; cx.globalAlpha=.4+.15*Math.sin(ts*.007);
      cx.beginPath(); cx.arc(0,0,r*.92,0,TAU); cx.stroke();
      // Eye
      const ea=o.eyeAng-o.hd;
      cx.fillStyle='rgba(64,220,240,.9)'; cx.globalAlpha=.8; cx.beginPath(); cx.arc(Math.cos(ea)*r*.3,Math.sin(ea)*r*.3,r*.14,0,TAU); cx.fill();
      cx.fillStyle='#012'; cx.beginPath(); cx.arc(Math.cos(ea)*r*.36,Math.sin(ea)*r*.36,r*.06,0,TAU); cx.fill();
      break; }

    case 'bloom': {
      const pu=.42+.2*Math.sin(o.breathPh*1.3);
      cx.fillStyle=col; cx.globalAlpha=pu*.08; cx.beginPath(); cx.arc(0,0,r*1.8,0,TAU); cx.fill();
      if (o.lobes) for (const lb of o.lobes) {
        const lbr=r*lb.r*(1+.07*Math.sin(o.breathPh+lb.ph));
        const lx=Math.cos(lb.a)*r*lb.d, ly=Math.sin(lb.a)*r*lb.d;
        cx.fillStyle=col; cx.globalAlpha=pu*.35; cx.beginPath(); cx.arc(lx,ly,lbr,0,TAU); cx.fill();
        cx.fillStyle='rgba(255,255,255,.1)'; cx.globalAlpha=pu*.6; cx.beginPath(); cx.arc(lx*1.1,ly*1.1,lbr*.24,0,TAU); cx.fill();
      }
      cx.fillStyle='rgba(255,255,255,.22)'; cx.globalAlpha=pu*.9; cx.beginPath(); cx.arc(0,0,r*.22,0,TAU); cx.fill();
      break; }

    case 'mote': {
      cx.fillStyle=col; cx.globalAlpha=.42;
      cx.beginPath(); cx.arc(0,0,r,0,TAU); cx.fill();
      cx.strokeStyle=col; cx.lineWidth=.4; cx.globalAlpha=.5;
      cx.beginPath(); cx.arc(0,0,r,0,TAU); cx.stroke();
      // Tiny nucleus
      cx.fillStyle=dim; cx.globalAlpha=.3; cx.beginPath(); cx.arc(-r*.06,-r*.06,r*.28,0,TAU); cx.fill();
      cx.fillStyle='rgba(255,255,255,.35)'; cx.globalAlpha=.6; cx.beginPath(); cx.arc(-r*.04,-r*.08,r*.1,0,TAU); cx.fill();
      break; }

    case 'polyp': {
      cx.fillStyle=col; cx.globalAlpha=.45;
      for (let i=0;i<3;i++) { const pa=(i/3)*TAU+ts*.002; cx.beginPath(); cx.arc(Math.cos(pa)*r*.3,Math.sin(pa)*r*.3,r*.65,0,TAU); cx.fill(); }
      cx.fillStyle='rgba(255,255,255,.15)'; cx.globalAlpha=.4; cx.beginPath(); cx.arc(0,0,r*.2,0,TAU); cx.fill();
      break; }

    case 'tendril': {
      cx.fillStyle=col; cx.globalAlpha=.38;
      cx.beginPath(); cx.moveTo(-r*.85,r*.1); cx.quadraticCurveTo(-r*.9,-r*.72,0,-r); cx.quadraticCurveTo(r*.9,-r*.72,r*.85,r*.1); cx.quadraticCurveTo(r*.4,r*.26,0,r*.14); cx.quadraticCurveTo(-r*.4,r*.26,-r*.85,r*.1); cx.fill();
      // Tendrils
      cx.strokeStyle=col; cx.lineWidth=.55; cx.globalAlpha=.18;
      for (let t=0;t<5;t++) {
        const bx=(t-2)*r*.28; let tx=bx,ty=r*.12;
        cx.beginPath(); cx.moveTo(bx,r*.12);
        for (let seg=0;seg<5;seg++) { tx+=Math.sin(o.finPh+t*1.1+seg*.7)*r*.1; ty+=r*.22; cx.lineTo(tx,ty); }
        cx.stroke();
      }
      break; }

    case 'hunter': {
      cx.fillStyle=col; cx.globalAlpha=.52;
      cx.beginPath(); cx.moveTo(r*1.22,0); cx.quadraticCurveTo(r*.9,-r*.3,r*.3,-r*.34); cx.lineTo(-r*.5,-r*.28); cx.quadraticCurveTo(-r*.88,0,-r*.5,r*.28); cx.lineTo(r*.3,r*.34); cx.quadraticCurveTo(r*.9,r*.3,r*1.22,0); cx.fill();
      // Tail fork
      cx.fillStyle=dim; cx.globalAlpha=.3;
      cx.beginPath(); cx.moveTo(-r*.86,0); cx.lineTo(-r*1.12,-r*.22); cx.lineTo(-r*.9,0); cx.fill();
      cx.beginPath(); cx.moveTo(-r*.86,0); cx.lineTo(-r*1.12,r*.22); cx.lineTo(-r*.9,0); cx.fill();
      // Dorsal
      cx.globalAlpha=.28; cx.beginPath(); cx.moveTo(r*.08,-r*.34); cx.lineTo(r*.22+Math.sin(o.finPh)*r*.03,-r*.58); cx.lineTo(r*.4,-r*.3); cx.fill();
      // Eye
      if (r*zm>5) { const ea=o.eyeAng-o.hd; cx.fillStyle='#fff'; cx.globalAlpha=.8; cx.beginPath(); cx.arc(r*.52,-r*.07,r*.1,0,TAU); cx.fill(); cx.fillStyle='#300'; cx.globalAlpha=1; cx.beginPath(); cx.arc(r*.53,-r*.07,r*.05,0,TAU); cx.fill(); }
      break; }

    case 'lurker': {
      cx.fillStyle=col; cx.globalAlpha=o.ambR?.3:.45;
      cx.beginPath(); cx.moveTo(r*.42,0); cx.quadraticCurveTo(r*.6,-r*.4,r*.08,-r*.62); cx.quadraticCurveTo(-r*.4,-r*.78,-r*.68,-r*.25); cx.quadraticCurveTo(-r*.92,0,-r*.68,r*.25); cx.quadraticCurveTo(-r*.4,r*.78,r*.08,r*.62); cx.quadraticCurveTo(r*.6,r*.4,r*.42,0); cx.fill();
      // Lure
      if (o.ambR) {
        const lx=r*.62+Math.sin(o.lAng)*r*.18, ly=-r*.52+Math.cos(o.lAng)*r*.1;
        cx.strokeStyle='rgba(255,255,255,.1)'; cx.lineWidth=.3; cx.globalAlpha=.25;
        cx.beginPath(); cx.moveTo(r*.1,-r*.6); cx.quadraticCurveTo(r*.36,-r*.82,lx,ly); cx.stroke();
        cx.fillStyle='#6AE856'; cx.globalAlpha=.45+.35*Math.sin(ts*.008);
        cx.shadowBlur=10*zm; cx.shadowColor='#6AE856';
        cx.beginPath(); cx.arc(lx,ly,2.5,0,TAU); cx.fill();
      }
      break; }

    case 'levia': {
      cx.fillStyle=col; cx.globalAlpha=.4;
      cx.beginPath(); cx.moveTo(r*1.12,0); cx.quadraticCurveTo(r,-r*.42,r*.22,-r*.5); cx.quadraticCurveTo(-r*.32,-r*.52,-r*.62,-r*.28); cx.quadraticCurveTo(-r*1.02,0,-r*.62,r*.28); cx.quadraticCurveTo(-r*.32,r*.52,r*.22,r*.5); cx.quadraticCurveTo(r,r*.42,r*1.12,0); cx.fill();
      cx.fillStyle=dim; cx.globalAlpha=.28;
      cx.beginPath(); cx.moveTo(-r*.97,0); cx.lineTo(-r*1.32,-r*.3); cx.lineTo(-r*1.08,0); cx.fill();
      cx.beginPath(); cx.moveTo(-r*.97,0); cx.lineTo(-r*1.32,r*.3); cx.lineTo(-r*1.08,0); cx.fill();
      // Spots
      cx.fillStyle='rgba(255,255,255,.06)';
      for (let i=0;i<4;i++) { const sa=(i/4)*TAU+ts*.0008; cx.globalAlpha=.25+.1*Math.sin(o.breathPh+i); cx.beginPath(); cx.arc(Math.cos(sa)*r*.4,Math.sin(sa)*r*.35,r*.06,0,TAU); cx.fill(); }
      break; }

    case 'phantom': {
      cx.fillStyle=col; cx.globalAlpha=.32;
      cx.beginPath(); cx.moveTo(r*.88,0); cx.quadraticCurveTo(r*.5,-r*.5,0,-r*.44); cx.quadraticCurveTo(-r*.6,-r*.22,-r*.36,0); cx.quadraticCurveTo(-r*.6,r*.22,0,r*.44); cx.quadraticCurveTo(r*.5,r*.5,r*.88,0); cx.fill();
      // Spiral wisp
      cx.strokeStyle=col; cx.lineWidth=.45; cx.globalAlpha=.1;
      cx.beginPath();
      for (let a=0;a<TAU*1.5;a+=.07) { const sr=a/(TAU*1.5)*r*.58; cx.lineTo(Math.cos(a+ts*.003)*sr,Math.sin(a+ts*.003)*sr); }
      cx.stroke();
      // Glow centre
      cx.fillStyle='rgba(255,255,255,.18)'; cx.globalAlpha=.45+.2*Math.sin(ts*.006+o.ph);
      cx.beginPath(); cx.arc(0,0,r*.22,0,TAU); cx.fill();
      break; }

    case 'behemoth': {
      cx.fillStyle=col; cx.globalAlpha=.4;
      cx.beginPath();
      for (let i=0;i<8;i++) { const a=(i/8)*TAU; cx.lineTo(Math.cos(a)*r*(1+((i%2)?.07:0)),Math.sin(a)*r*(1+((i%2)?.07:0))); }
      cx.closePath(); cx.fill();
      // Armor spines
      cx.fillStyle=dim; cx.globalAlpha=.28;
      for (let i=0;i<6;i++) { const sa=(i/6)*TAU+ts*.001,tip=r*1.38; cx.beginPath(); cx.moveTo(Math.cos(sa-.09)*r,Math.sin(sa-.09)*r); cx.lineTo(Math.cos(sa)*tip,Math.sin(sa)*tip); cx.lineTo(Math.cos(sa+.09)*r,Math.sin(sa+.09)*r); cx.fill(); }
      // Central eye
      if (r*zm>6) { cx.fillStyle='#fff'; cx.globalAlpha=.75; cx.beginPath(); cx.arc(r*.38,-r*.05,r*.1,0,TAU); cx.fill(); cx.fillStyle='#600'; cx.globalAlpha=1; cx.beginPath(); cx.ellipse(r*.39,-r*.05,r*.03,r*.07,0,0,TAU); cx.fill(); }
      break; }

    case 'grazer': {
      // Docile colossus — a broad, translucent, gently-undulating body with a
      // luminous core and a slow tail fluke. Reads as serene and edible.
      cx.fillStyle=col; cx.globalAlpha=.30;
      cx.beginPath();
      cx.moveTo(r*1.05,0);
      cx.quadraticCurveTo(r*.7,-r*.62, -r*.1,-r*.6);
      cx.quadraticCurveTo(-r*.72,-r*.5, -r*.95,-r*.16);
      cx.quadraticCurveTo(-r*1.1,0, -r*.95,r*.16);
      cx.quadraticCurveTo(-r*.72,r*.5, -r*.1,r*.6);
      cx.quadraticCurveTo(r*.7,r*.62, r*1.05,0);
      cx.fill();
      // Tail fluke — sways with finPh
      cx.fillStyle=dim; cx.globalAlpha=.26;
      const gf=Math.sin(o.finPh)*r*.12;
      cx.beginPath(); cx.moveTo(-r*.9,0); cx.lineTo(-r*1.3,-r*.34+gf); cx.lineTo(-r*1.05,0); cx.lineTo(-r*1.3,r*.34+gf); cx.closePath(); cx.fill();
      // Internal bioluminescent core
      cx.fillStyle='rgba(255,255,255,.16)'; cx.globalAlpha=.4+.2*Math.sin(o.breathPh);
      cx.beginPath(); cx.arc(r*.1,0,r*.34,0,TAU); cx.fill();
      // Glowing nodes drifting through the body
      cx.fillStyle=col;
      for (let i=0;i<6;i++) { const sa=(i/6)*TAU+ts*.0006; cx.globalAlpha=.3+.18*Math.sin(o.breathPh+i*1.1); cx.beginPath(); cx.arc(Math.cos(sa)*r*.5,Math.sin(sa)*r*.34,r*.07,0,TAU); cx.fill(); }
      // Trailing feeding fronds
      cx.strokeStyle=col; cx.lineWidth=.6; cx.lineCap='round'; cx.globalAlpha=.16;
      for (let t=0;t<4;t++) { const bx=-r*.2+t*r*.12; let fx=bx,fy=r*.5; cx.beginPath(); cx.moveTo(bx,r*.5); for (let seg=0;seg<4;seg++){ fx+=Math.sin(o.finPh+t+seg*.8)*r*.07; fy+=r*.2; cx.lineTo(fx,fy); } cx.stroke(); }
      break; }

    default: {
      cx.fillStyle=col; cx.globalAlpha=.45; cx.beginPath(); cx.arc(0,0,r,0,TAU); cx.fill();
      cx.fillStyle='rgba(255,255,255,.14)'; cx.globalAlpha=.4; cx.beginPath(); cx.arc(-r*.06,-r*.08,r*.24,0,TAU); cx.fill();
      break; }
  }

  cx.restore();

  // HP arc
  if (o.hp<o.mhp && r*zm>3) {
    const pct=o.hp/o.mhp;
    cx.strokeStyle=pct>.5?'rgba(100,220,100,.28)':pct>.25?'rgba(220,220,60,.28)':'rgba(220,70,70,.28)';
    cx.lineWidth=.9; cx.beginPath(); cx.arc(o.x,o.y,r+2,-PI/2,-PI/2+pct*TAU); cx.stroke();
  }
  // Eat/flee indicator
  if (dd<280 && r*zm>3) {
    if (canEat(o)) {
      cx.fillStyle='rgba(100,220,80,.28)'; cx.beginPath(); cx.moveTo(o.x-2.5,o.y-r-8); cx.lineTo(o.x+2.5,o.y-r-8); cx.lineTo(o.x,o.y-r-3); cx.fill();
    } else if (isPred(o)) {
      cx.fillStyle='rgba(220,55,55,.28)'; cx.beginPath(); cx.moveTo(o.x-2.5,o.y-r-3); cx.lineTo(o.x+2.5,o.y-r-3); cx.lineTo(o.x,o.y-r-8); cx.fill();
    }
  }
  cx.shadowBlur=0; cx.globalAlpha=1;
}

// ═══════════════════════════════════════════
// DRAW TAIL — FIXED JUNCTION
// The tail uses source-over compositing so the
// body circle drawn afterwards fully covers the root.
// No shadow blur in tail so there's no glow bleedthrough.
// ═══════════════════════════════════════════
function drawTail(ts) {
