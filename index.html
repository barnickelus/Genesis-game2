<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>GENESIS EVOLUTION</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#00050e;touch-action:none}
#g{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ── HUD ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hudTL{position:absolute;top:18px;left:20px;display:flex;flex-direction:column;gap:5px}
#stgName{font-family:'Cinzel',serif;font-size:14px;letter-spacing:7px;color:#fff;opacity:.88;text-transform:uppercase;text-shadow:0 0 20px currentColor}
#massTxt{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.28);font-style:italic}
#massTxt b{font-style:normal;font-weight:400;font-size:15px;color:rgba(255,255,255,.62)}
#evoBarWrap{width:150px;height:2px;background:rgba(255,255,255,.05);border-radius:1px;overflow:hidden;margin-top:1px}
#evoBar{height:100%;width:0;border-radius:1px;transition:width .5s ease}
#evoNxtLbl{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.14);font-style:italic;margin-top:2px}
#hudTR{position:absolute;top:16px;right:18px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#scoreTxt{font-family:'Cinzel',serif;font-size:13px;letter-spacing:3px;color:rgba(255,255,255,.2)}
#abilTxt{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.18);font-style:italic}
#frzHud{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;color:#40c8f0;text-shadow:0 0 12px #40c8f0;margin-top:4px;opacity:0;transition:opacity .2s}
#frzHud.on{opacity:.95}
#frzBar{width:90px;height:2px;background:rgba(64,200,240,.18);margin-top:3px;border-radius:1px;overflow:hidden}
#frzBar i{display:block;height:100%;background:#40c8f0;box-shadow:0 0 8px #40c8f0;transition:width .12s linear}
#cdC{margin-top:2px;opacity:.38}

/* ── Evolution announce ── */
#evoAnn{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex;align-items:flex-start;justify-content:center;padding-top:max(70px,env(safe-area-inset-top,0px) + 60px);opacity:0;transition:opacity .7s}
#evoBox{text-align:center;padding:14px 32px;background:rgba(0,5,14,.42);border:1px solid rgba(255,255,255,.06);border-radius:2px;box-shadow:0 4px 22px rgba(0,0,0,.4);transform:translateY(-6px);transition:transform .7s}
#evoAnn[style*="opacity: 1"] #evoBox{transform:translateY(0)}
#evoBox h1{font-family:'Cinzel',serif;font-size:clamp(18px,3.4vw,28px);letter-spacing:10px;margin-bottom:6px}
#evoBox p{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.45);font-style:italic}

/* ── Flash / vignette ── */
#flash{position:fixed;inset:0;z-index:19;pointer-events:none;opacity:0;transition:opacity .25s}
#danger{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .45s;background:radial-gradient(ellipse at center,transparent 35%,rgba(130,6,0,.22) 100%)}

/* ── Intro ── */
#intro{position:fixed;inset:0;z-index:50;background:#00050e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity 1.4s;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#iTitle{font-family:'Cinzel',serif;font-size:clamp(20px,5vw,40px);letter-spacing:clamp(8px,2.5vw,20px);color:#fff;opacity:0;transition:opacity 1.8s;text-align:center;animation:titleBreathe 6s ease-in-out infinite 2s}
#iSub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(11px,2vw,14px);letter-spacing:5px;color:rgba(255,255,255,.3);opacity:0;transition:opacity 1.8s .9s;text-align:center}
#iHint{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.15);opacity:0;transition:opacity 1.8s 1.8s;text-align:center;animation:hintPulse 2.6s ease-in-out infinite 3.5s}
#iLine{width:1px;height:0;background:rgba(255,255,255,.12);transition:height 1.8s .4s;position:absolute;top:50%;margin-top:-60px}
#iSpark{position:absolute;top:50%;left:50%;width:2px;height:2px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);opacity:0;box-shadow:0 0 18px 4px rgba(82,255,202,.55);animation:sparkPulse 3.4s ease-in-out infinite 2.4s}
@keyframes titleBreathe{0%,100%{letter-spacing:clamp(8px,2.5vw,20px);text-shadow:0 0 24px rgba(255,255,255,.18)}50%{letter-spacing:clamp(9px,2.7vw,22px);text-shadow:0 0 40px rgba(255,255,255,.32)}}
@keyframes hintPulse{0%,100%{opacity:.18;letter-spacing:3px}50%{opacity:.55;letter-spacing:4px}}
@keyframes sparkPulse{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.4)}50%{opacity:.55;transform:translate(-50%,-50%) scale(1.4)}}

/* canvas baseline */
#g{touch-action:none;-webkit-tap-highlight-color:transparent;display:block}

/* ── Pause ── */
#pBtn{position:fixed;top:11px;right:16px;z-index:15;background:none;border:none;color:rgba(255,255,255,.15);font-size:15px;cursor:pointer;pointer-events:auto;font-family:serif}

/* Cheat button — adds +100 mass on tap. Bottom right, subtle but discoverable. */
#cheatBtn{position:fixed;bottom:14px;right:14px;z-index:15;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;
  padding:9px 14px;background:rgba(8,16,28,.55);
  border:1px solid rgba(255,255,255,.10);border-radius:2px;
  color:rgba(255,215,0,.55);text-shadow:0 0 6px rgba(255,215,0,.35);
  cursor:pointer;pointer-events:auto;
  transition:transform .08s,background .12s,color .12s;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#cheatBtn:active{transform:scale(.93);background:rgba(255,215,0,.18);color:#FFD700}
#cheatBtn:hover{color:rgba(255,215,0,.9);background:rgba(8,16,28,.75)}
/* Morph button — only shown in swarm mode; cycles colony shape (shape = ability). */
#morphBtn{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:16;display:none;
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;
  padding:11px 20px;background:rgba(8,20,30,.62);
  border:1px solid rgba(156,240,255,.30);border-left:3px solid #9CF0FF;border-radius:2px;
  color:rgba(156,240,255,.85);text-shadow:0 0 8px rgba(156,240,255,.5);
  cursor:pointer;pointer-events:auto;
  transition:transform .08s,background .12s,color .12s;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#morphBtn:active{transform:translateX(-50%) scale(.94);background:rgba(156,240,255,.2)}
#morphBtn.on{display:block}
/* Bud-hive button — only in swarm mode; spends mass to spawn a satellite forager.
   Sits to the LEFT of MORPH so it never overlaps the bottom-right +100 cheat button. */
#budBtn{position:fixed;bottom:14px;left:calc(50% - 130px);transform:translateX(-50%);z-index:16;display:none;
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;
  padding:11px 18px;background:rgba(30,24,8,.62);
  border:1px solid rgba(255,216,96,.30);border-left:3px solid #FFD860;border-radius:2px;
  color:rgba(255,216,96,.85);text-shadow:0 0 8px rgba(255,216,96,.5);
  cursor:pointer;pointer-events:auto;
  transition:transform .08s,background .12s,opacity .2s;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#budBtn:active{transform:translateX(-50%) scale(.94);background:rgba(255,216,96,.2)}
#budBtn.on{display:block}
#budBtn.disabled{opacity:.35}
#pMenu{position:fixed;inset:0;z-index:30;background:rgba(0,5,14,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:11px;backdrop-filter:blur(18px)}
#pMenu h2{font-family:'Cinzel',serif;font-size:18px;letter-spacing:10px;color:rgba(255,255,255,.35);margin-bottom:14px}
#pMenu button{width:138px;padding:10px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:rgba(255,255,255,.38);background:transparent;border:1px solid rgba(255,255,255,.07);cursor:pointer;letter-spacing:2px;transition:all .3s}
#pMenu button:hover{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.2)}

/* ── Adaptation chooser ── */
#adapt{position:fixed;inset:0;z-index:32;background:rgba(0,5,14,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;backdrop-filter:blur(20px)}
#adapt.on{display:flex;animation:adaptIn .5s ease}
@keyframes adaptIn{from{opacity:0}to{opacity:1}}
#adaptTitle{font-family:'Cinzel',serif;font-size:clamp(16px,3vw,24px);letter-spacing:10px;color:#9CF0FF;text-shadow:0 0 18px rgba(156,240,255,.5)}
#adaptSub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:3px;color:rgba(255,255,255,.4);margin-bottom:18px}
#adaptCards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:680px;padding:0 14px}
.adaptCard{width:180px;min-height:172px;padding:18px 16px;background:rgba(8,18,30,.7);border:1px solid rgba(156,240,255,.18);border-top:2px solid #9CF0FF;border-radius:3px;cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:transform .12s,background .15s,border-color .15s;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.adaptCard:hover,.adaptCard:active{transform:translateY(-4px);background:rgba(14,30,46,.85);border-color:rgba(156,240,255,.5)}
.adaptCard .cName{font-family:'Cinzel',serif;font-size:14px;letter-spacing:3px;color:#9CF0FF}
.adaptCard .cCat{font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.3);text-transform:uppercase}
.adaptCard .cDesc{font-family:'Cormorant Garamond',serif;font-size:13px;line-height:1.35;color:rgba(255,255,255,.6);flex:1}
.adaptCard .cLv{font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;color:rgba(156,240,255,.7)}
.adaptCard .cLv.up{color:#FFD860}

/* ── Minimap ── */
#mmap{position:fixed;bottom:14px;left:14px;z-index:10;border:1px solid rgba(255,255,255,.04);background:rgba(0,0,0,.18)}

/* ── RADAR HUD ── */
/* Always-visible panel above minimap. Shows radar status, range, and live target
 * counts (edible / precision / threat). Becomes prominent once unlocked at DRIFTER,
 * fully featured at MEDUSA. Hidden entirely at MOTE (no radar yet). */
#radarHud{position:fixed;bottom:108px;left:14px;z-index:10;pointer-events:none;
  font-family:'Cinzel',serif;width:138px;padding:10px 13px 11px;
  background:rgba(8,16,28,.62);border:1px solid rgba(255,255,255,.08);
  border-left:3px solid #14D0FF;box-shadow:0 0 18px rgba(20,208,255,.12);
  border-radius:2px;
  opacity:0;transform:translateX(-8px);transition:opacity .55s,transform .55s}
#radarHud.on{opacity:1;transform:translateX(0)}
#radarHeader{font-size:12px;letter-spacing:4px;color:#14D0FF;text-shadow:0 0 10px #14D0FF;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
#radarHeader::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#14D0FF;box-shadow:0 0 8px #14D0FF;margin-right:6px;animation:radarBlip 2s ease-in-out infinite}
#radarLvl{font-size:10px;letter-spacing:1.5px;color:rgba(20,208,255,.75)}
#radarRange{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:1px;color:rgba(255,255,255,.5);margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.06)}
.rTgt{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1.5px;padding:2px 0;font-family:'Cormorant Garamond',serif}
.rTgt b{font-weight:400;font-size:14px;font-family:'Cinzel',serif;min-width:18px;text-align:right}
.rTgt.edible{color:#52FFCA}
.rTgt.precise{color:#FFD860}
.rTgt.threat{color:#FF4858}
.rDot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
.rTgt.edible .rDot{background:#52FFCA;box-shadow:0 0 7px #52FFCA}
.rTgt.precise .rDot{background:#FFD860;box-shadow:0 0 7px #FFD860}
.rTgt.threat .rDot{background:#FF4858;box-shadow:0 0 7px #FF4858}
@keyframes radarBlip{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
#mmC{display:block}
</style>
</head>
<body>
<canvas id="g"></canvas>

<div id="hud">
  <div id="hudTL">
    <div id="stgName">MOTE</div>
    <div id="massTxt"><b id="massV">10</b>&thinsp;mass</div>
    <div id="evoBarWrap"><div id="evoBar"></div></div>
    <div id="evoNxtLbl"></div>
  </div>
  <div id="hudTR">
    <div id="scoreTxt">0</div>
    <div id="abilTxt"></div>
    <canvas id="cdC" width="26" height="26"></canvas>
    <div id="frzHud">FRENZY<div id="frzBar"><i></i></div></div>
  </div>
</div>

<div id="evoAnn"><div id="evoBox"><h1 id="evoT"></h1><p id="evoS"></p></div></div>
<div id="flash"></div>
<div id="danger"></div>

<div id="intro">
  <div id="iLine"></div>
  <div id="iSpark"></div>
  <div id="iTitle">GENESIS EVOLUTION</div>
  <div id="iSub">in the beginning, there was signal</div>
  <div id="iHint">touch to emerge</div>
</div>

<button id="pBtn">⏸</button>
<button id="cheatBtn" title="dev: complete objective + advance a stage">▶▶ SKIP</button>
<button id="morphBtn" title="Cycle colony shape">◇ MORPH</button>
<button id="budBtn" title="Bud a satellite hive">⬡ BUD HIVE</button>
<div id="pMenu">
  <h2>PAUSED</h2>
  <button id="resumeB">Resume</button>
  <button id="restartB">Restart</button>
  <button id="muteB">Mute</button>
</div>

<!-- Adaptation chooser — pick 1 of 3 trait cards at evolution (see docs/TRAIT_SYSTEM.md) -->
<div id="adapt">
  <h2 id="adaptTitle">ADAPT</h2>
  <p id="adaptSub">Choose an adaptation</p>
  <div id="adaptCards"></div>
</div>

<div id="mmap"><canvas id="mmC" width="80" height="80"></canvas></div>

<!-- Radar HUD — unlocks at DRIFTER, becomes informative at MEDUSA -->
<div id="radarHud">
  <div id="radarHeader"><span>RADAR</span><span id="radarLvl">L1</span></div>
  <div id="radarRange">— range —</div>
  <div class="rTgt edible"><span><span class="rDot"></span>FOOD</span><b id="rEdib">0</b></div>
  <div class="rTgt precise"><span><span class="rDot"></span>STRIKE</span><b id="rPrec">0</b></div>
  <div class="rTgt threat"><span><span class="rDot"></span>THREAT</span><b id="rThr">0</b></div>
</div>

<!-- Background music: if a file named "background-music.mp3" sits next to this
     HTML, it will be loaded and routed through the stage-aware filter. If the
     file is missing, the procedural drone engine below provides an ambient bed. -->
<audio id="bgm" src="background-music.mp3" loop preload="auto"></audio>

<script>
'use strict';

// ═══════════════════════════════════════════
// CANVAS + RESIZE
// ═══════════════════════════════════════════
const G = document.getElementById('g');
const cx = G.getContext('2d', {alpha: false});

// ── High-DPI rendering ──────────────────────────────────────────────────────
// The backing store is decoupled from the CSS box so the world renders pixel-
// crisp on retina / mobile panels instead of being upscaled from a soft 1× buffer.
//   W,H   — *device* pixels. Everything draws in this space (clears, transforms,
//           offsets, screen-space overlays). This is the true framebuffer size.
//   CW,CH — *CSS* pixels. Used only for pointer mapping and camera zoom, so the
//           feel of the game is identical regardless of pixel density.
// DPR is capped at 2 so a 3× phone doesn't pay for 9× the fill cost.
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W, H, CW, CH;
function resize() {
  CW = innerWidth; CH = innerHeight;
  W = G.width  = Math.round(CW * DPR);
  H = G.height = Math.round(CH * DPR);
  G.style.width  = CW + 'px';
  G.style.height = CH + 'px';
}
addEventListener('resize', resize); resize();

// ═══════════════════════════════════════════
// MATH UTILS
// ═══════════════════════════════════════════
const TAU = Math.PI * 2, PI = Math.PI;
const rng  = (a, b) => a + Math.random() * (b - a);
const rni  = (a, b) => Math.floor(rng(a, b));
const lp   = (a, b, t) => a + (b - a) * t;
const cl   = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const dst  = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
const ang  = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);

// ═══════════════════════════════════════════
// SPATIAL HASH
// ═══════════════════════════════════════════
const CELL = 160;
let grid = {};
function gKey(x, y) { return ((x / CELL | 0) + 5000) + ',' + ((y / CELL | 0) + 5000); }
function gIns(o) { const k = gKey(o.x, o.y); (grid[k] || (grid[k] = [])).push(o); }
function gNear(x, y, radius) {
  const out = [], cr = Math.ceil(radius / CELL), cx0 = x / CELL | 0, cy0 = y / CELL | 0;
  for (let dx = -cr; dx <= cr; dx++) for (let dy = -cr; dy <= cr; dy++) {
    const k = (cx0 + dx + 5000) + ',' + (cy0 + dy + 5000);
    const c = grid[k]; if (c) for (const o of c) out.push(o);
  }
  return out;
}
function rebuildGrid() { grid = {}; for (const o of orgs) gIns(o); }

// ═══════════════════════════════════════════
// PALETTE + STAGE DATA
// ═══════════════════════════════════════════
const COL = {
  mote:  { pri: '#52FFCA', dim: '#0d3828', gl: 'rgba(82,255,202,' },
  drift: { pri: '#14D0FF', dim: '#002e48', gl: 'rgba(20,208,255,' },
  medu:  { pri: '#C87FFF', dim: '#28084c', gl: 'rgba(200,127,255,' },
  naga:  { pri: '#FF9830', dim: '#3a1200', gl: 'rgba(255,152,48,' },
  titan: { pri: '#5AC8FF', dim: '#082840', gl: 'rgba(90,200,255,' },
  primo: { pri: '#FFD700', dim: '#382a00', gl: 'rgba(255,215,0,' },
};

// ═══════════════════════════════════════════
// THE ORGANIZATION SPINE  (docs/REBUILD_SPINE.md)
// One fantasy: life organizing into ever-larger levels of complexity.
// Mass is the FUEL. Each stage's OBJECTIVE is the story — evolution requires
// the objective complete AND the mass threshold. Phases group the stages into
// the emotional arc: fear → power → transcendence → stewardship.
// ═══════════════════════════════════════════
const PHASES = [
  { name: 'PHASE I · EMERGENCE',     first: 0, c: '#52FFCA', sub: 'Life learns to survive.' },
  { name: 'PHASE II · PREDATION',    first: 3, c: '#FF9830', sub: 'Life learns to hunt.' },
  { name: 'PHASE III · SUPERORGANISM', first: 5, c: '#5AC8FF', sub: 'One body is no longer enough.' },
];
function phaseStartingAt(stgIdx) { return PHASES.find(p => p.first === stgIdx) || null; }

// obj.kind drives the objective engine: 'eat' | 'explore' | 'precision' |
// 'apex' | 'territory' | 'critical'. objN = target count.
const STAGES = [
  { name: 'MOTE',       thr: 0,    next: 120,  c: COL.mote,  spd: 2.8, bR: 6, desc: 'Consume the smaller.',                ab: null,       abT: '',         cd: 0,
    obj: { kind:'eat',       n: 20, label: 'Consume 20 organisms' } },
  { name: 'DRIFTER',    thr: 120,  next: 380,  c: COL.drift, spd: 3.2, bR: 7, desc: 'Propulsion stirs — the world declares itself.', ab: 'dash', abT: '↑ Dash',    cd: 700,
    obj: { kind:'explore',   n: 4,  label: 'Chart the dark — visit 4 beacons' } },
  { name: 'MEDUSA',     thr: 380,  next: 850,  c: COL.medu,  spd: 2.6, bR: 8, desc: 'Sting aura radiates. Soft seams glow.', ab: 'sting',  abT: 'Sting Aura',cd: 0,
    obj: { kind:'precision', n: 5,  label: 'Strike 5 weak spots' } },
  { name: 'NAGA',       thr: 850,  next: 2200, c: COL.naga,  spd: 3.4, bR: 7, desc: 'The lash awakens. Veils unravel.',     ab: 'whip',     abT: '↑ Whip',    cd: 1000,
    obj: { kind:'apex',      n: 3,  label: 'Fell 3 true predators' } },
  { name: 'PRIMORDIAL', thr: 2200, next: 5000, c: COL.primo, spd: 2.8, bR: 8, desc: 'The first and the last. Rend the deep.', ab: 'bolt',   abT: '↑ Bolt',    cd: 400,
    obj: { kind:'territory', n: 3,  label: 'Claim 3 dominion sites' } },
  { name: 'TITAN',      thr: 5000, next: 1/0,  c: COL.titan, spd: 3.0, bR: 9, desc: 'The filter-feeder wakes. Drift, and swallow the ocean.', ab: 'echo', abT: '↑ Stun Echo', cd: 900,
    obj: { kind:'critical',  n: 1,  label: 'Reach the Singularity' } },
];

// ═══════════════════════════════════════════
// ORGANISM DEFINITIONS
// ═══════════════════════════════════════════
const ORGS = {
  bloom:    { col:'#34D898', dim:'#123828', minR:4,   maxR:7,   spd:.04,  hp:1,  mass:8,   beh:'bloom',   spW:500,  mx:12             },
  mote:     { col:'#6AE856', dim:'#1a4212', minR:2.5, maxR:5.5, spd:.25,  hp:1,  mass:5,   beh:'drift',   spW:700,  mx:55, school:true, schR:90  },
  polyp:    { col:'#D8D030', dim:'#383c08', minR:5,   maxR:9,   spd:.5,   hp:2,  mass:12,  beh:'swarm',   spW:850,  mx:28, school:true, schR:110 },
  tendril:  { col:'#DC60A8', dim:'#340c28', minR:8,   maxR:14,  spd:.4,   hp:4,  mass:22,  beh:'pulse',   spW:950,  mx:12, school:true, schR:130 },
  hunter:   { col:'#E83030', dim:'#320606', minR:12,  maxR:22,  spd:1.5,  hp:8,  mass:35,  beh:'chase',   spW:1100, mx:8              },
  lurker:   { col:'#D07830', dim:'#301a06', minR:14,  maxR:26,  spd:.3,   hp:11, mass:50,  beh:'ambush',  spW:1300, mx:5              },
  levia:    { col:'#5890D8', dim:'#102040', minR:30,  maxR:50,  spd:.6,   hp:30, mass:90,  beh:'passive', spW:1500, mx:3              },
  phantom:  { col:'#C050E0', dim:'#240840', minR:16,  maxR:30,  spd:1,    hp:18, mass:60,  beh:'lure',    spW:1400, mx:4              },
  behemoth: { col:'#D01818', dim:'#300202', minR:40,  maxR:65,  spd:1.2,  hp:50, mass:140, beh:'apex',    spW:1800, mx:2              },
  echo:     { col:'#D8ECF4', dim:'#303e44', minR:11,  maxR:20,  spd:1,    hp:18, mass:65,  beh:'mirror',  spW:1100, mx:2              },
  // GRAZER — a docile colossus introduced at NAGA to break the mass wall. It is
  // deliberately mass-rich (150) yet kept to a modest radius (≤26) so a NAGA-sized
  // player can still swallow it, and slow enough to run down. This is the large,
  // safe meal the mid-game was missing; it is never a threat (low radius ⇒ never a
  // predator) and only ever appears from stage 3 onward (gated in the maintenance loop).
  grazer:   { col:'#7CE8B4', dim:'#1c4636', minR:19,  maxR:26,  spd:.45,  hp:8,  mass:150, beh:'graze',   spW:1600, mx:6              },
};

const PREY_OF = {
  hunter:   ['mote','polyp','bloom'],
  lurker:   ['mote','polyp','tendril'],
  phantom:  ['mote','polyp','tendril'],
  behemoth: ['mote','polyp','tendril','hunter','lurker','phantom'],
  levia:    ['bloom','mote'],
  tendril:  ['mote','bloom'],
  echo:     ['mote','polyp'],
};
const ECO_HUNT_R = { hunter:180, lurker:100, phantom:150, behemoth:250, levia:120, tendril:80, echo:140 };

// ═══════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════
let P, orgs, projs, parts, txts, dust;
let paused, gt, score;
let shx, shy, shi, shd;
let abil_cd, streak, streakT;
let off, zm;
let muted = false;
let frenzy, fTime, fMax, frenzyOrbs;
let shOn, shTime;
let pill, shld, beacons;
let anoms, anomCd;
// ── TITAN filter-feeder state ──
// titanPhase: 0 = Awakening (prey still sized, stun-echo matters), 1 = Colossus
// (overwhelmingly large, board reads as plankton, echo auto-pulses).
let titanPhase, titanEchoT, titanColossusShown;
let viewR = 2200;   // active world radius for spawn/despawn — grows as the camera pulls back
const TITAN_COLOSSUS = 7000;   // mass where TITAN (now the 5000+ endgame) tips Awakening → Colossus
const COLOSSUS_BREAK = 12000;  // mass where the mitosis CHOICE becomes available

// ── MICRO branch state (mitosis → swarm → colony) ──
// mode: 'single' = normal one-body game · 'choice' = breakpoint prompt up ·
//       'swarm' = herding a cloud of cells · (colony build comes later)
// See docs/MICRO_BRANCH.md for the full design.
let microMode = 'single';
let cells = [];                 // swarm cells once mitosis fires
let colonyShape = 'swarm';      // 'swarm' (loose) | 'filament' | 'radial' | 'sphere'
let colonyHd = 0;               // colony facing (smoothed from movement) for shaped slots
let plantRooted = false;        // PLANT form: true when rooted on a patch (photosynthesizing)
let plantRootT = 0;             // ms continuously rooted — ramps growth/complexity (bounded)
let breakPressure = 0;          // 0..1 — builds while pinned at the COLOSSUS ceiling
let microChoiceShown = false;
let frenzyTutorialShown = false;  // persists across restarts intentionally
let radarTutorialShown = false;
let behMem;
let introActive = true;

// ── THE SPINE: objective engine state ──
let objProg = 0;            // progress toward the current stage's objective
let domSites = [];          // PRIMORDIAL dominion sites {x,y,claimT,claimed}
// ── THE LIVING ECONOMY: detritus motes (kills/decay drop these; food blooms
//    where they settle — kill-grounds bloom, blooms attract life) ──
let detritus = [];
const DETRITUS_MAX = 80;
// ── THE EVOLVING ECOSYSTEM: per-species genome means. Individuals are born
//    around these; player kills apply selection pressure (means drift away from
//    each victim's phenotype — the survivors breed). Clamped + mutating.
let speciesGenes = {};
function resetSpeciesGenes() {
  speciesGenes = {};
  for (const t in ORGS) speciesGenes[t] = { spd: 1, size: 1, wary: 1 };
}
const GENE_MIN = 0.72, GENE_MAX = 1.42;
function gauss(mean, sd) { return mean + (Math.random()+Math.random()+Math.random()-1.5) * sd * 2; }

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
function init() {
  P = { x:0, y:0, r:6, mass:10, vx:0, vy:0, hd:0, stg:0,
        tail:[], blink:0, dash:false, dashT:0, boost:0, flash:{c:'#fff',t:0},
        traits:[], traitLv:{}, traitCd:{} };   // adaptation engine (see docs/TRAIT_SYSTEM.md)
  orgs=[]; projs=[]; parts=[]; txts=[]; dust=[]; frenzyOrbs=[];
  score=0; abil_cd=0; streak=0; streakT=0; gt=0; behMem=[];
  frenzy=false; fTime=0; fMax=8000; shOn=false; shTime=0;
  shx=shy=0; shi=shd=0; off={x:0,y:0}; zm=1;
  pill = { x:0, y:0, r:9, on:false, cd:0 };
  shld = { x:0, y:0, r:9, on:false, cd:0 };
  beacons = [{x:0,y:-1400},{x:0,y:1400},{x:1400,y:0},{x:-1400,y:0}].map(p=>({...p,r:14}));
  anoms = []; anomCd = 5000;  // first anomaly appears ~5s after start
  titanPhase = 0; titanEchoT = 0; titanColossusShown = false; viewR = 2200;
  microMode = 'single'; cells = []; colonyShape = 'swarm'; colonyHd = 0; breakPressure = 0; microChoiceShown = false; plantRootT = 0;
  patches = []; hives = [];
  objProg = 0; domSites = []; detritus = []; resetSpeciesGenes();

  spawn('bloom',10); spawn('mote',45); spawn('polyp',22); spawn('tendril',8);
  spawn('hunter',4); spawn('lurker',2); spawn('levia',2); spawn('phantom',2); spawn('behemoth',1);

  for (let i=0; i<55; i++) dust.push({
    x:rng(-1600,1600), y:rng(-1600,1600),
    s:rng(.15,.85), vx:rng(-.03,.03), vy:rng(-.03,.03),
    a:rng(.009,.04), ph:rng(0,TAU)
  });
}

// "Elder" prey scaling — the basic food types grow up with the player. As you
// evolve, freshly-spawned bloom/mote/polyp/tendril arrive larger and far more
// mass-rich, so the familiar small fry stay worth eating instead of becoming
// rounding error. Radius is scaled gently (and the eat threshold guarantees they
// stay edible); mass is scaled hard via a per-instance multiplier (massMul) read
// back in collide(). Predators are never scaled here.
const FOOD_TYPES = { bloom:1, mote:1, polyp:1, tendril:1 };
function spawn(type, n) {
  const T = ORGS[type];
  const tier = FOOD_TYPES[type] ? P.stg : 0;
  const rScale  = 1 + tier * 0.15;   // gentle — keeps them comfortably edible
  const massMul = 1 + tier * 0.65;   // steep — NAGA tendril ≈ 2.95× base mass
  for (let i=0; i<n; i++) {
    if (type==='echo' && orgs.filter(o=>o.type==='echo').length >= 2) return;

    // ── GENOME: born around the species' evolving means + mutation noise.
    // spd → quicker & sleeker · size → bigger body & meal · wary → flees earlier.
    const sg = speciesGenes[type] || { spd:1, size:1, wary:1 };
    const gen = {
      spd:  cl(gauss(sg.spd,  .07), GENE_MIN, GENE_MAX),
      size: cl(gauss(sg.size, .07), GENE_MIN, GENE_MAX),
      wary: cl(gauss(sg.wary, .09), GENE_MIN, GENE_MAX),
    };
    const r = rng(T.minR, T.maxR) * rScale * gen.size;

    // ── PLACEMENT: life blooms where detritus settled (the nutrient cycle);
    // otherwise spread around the player as before. TITAN keeps the wide field.
    const big = (typeof P !== 'undefined' && P && P.stg === 5);
    let x, y;
    const anchor = (typeof detritus !== 'undefined') ? detritusAnchor() : null;
    if (anchor && !big) {
      const aa = Math.random()*TAU, ad = rng(10, 90);
      x = anchor.x + Math.cos(aa)*ad; y = anchor.y + Math.sin(aa)*ad;
    } else {
      const a = Math.random()*TAU;
      const spread = big ? Math.max(1, viewR / 2200) : 1;
      const dMax   = big ? Math.max(T.spW, viewR * 0.9) : T.spW;
      const d = rng((type==='bloom'?60:180) * spread, dMax);
      x = P.x + Math.cos(a)*d; y = P.y + Math.sin(a)*d;
    }

    orgs.push({
      type, x, y,
      r, br:r, hp:T.hp, mhp:T.hp, vx:0, vy:0, hd:Math.random()*TAU, massMul, gen,
      stT:0, stunT:0, wAng:Math.random()*TAU, ph:rng(0,TAU),
      ambR: type==='lurker', lAng:rng(0,TAU), trail:[],
      flT:0, hSh:rng(-10,10), finPh:rng(0,TAU),
      breathPh:rng(0,TAU), eyeAng:0, scatterT:0,
      lobes: type==='bloom' ? Array.from({length:5},()=>({a:rng(0,TAU),d:rng(.25,.4),r:rng(.45,.6),ph:rng(0,TAU)})) : null
    });
  }
}

function stg() { return STAGES[P.stg]; }

// ═══════════════════════════════════════════
// OBJECTIVE ENGINE — each stage has a goal that gates evolution.
// objBump(kind) is called from gameplay events; only the matching kind counts.
// ═══════════════════════════════════════════
function objDef()      { return stg().obj; }
function objComplete() { const o = objDef(); return !o || objProg >= o.n; }
function objBump(kind, amt = 1) {
  const o = objDef();
  if (!o || o.kind !== kind || objProg >= o.n) return;
  objProg = Math.min(o.n, objProg + amt);
  if (objProg >= o.n) {
    announce('OBJECTIVE COMPLETE', stg().c.pri,
      P.mass >= (STAGES[P.stg+1]?.thr ?? Infinity)
        ? 'Evolution awaits.' : 'Now grow — evolution needs mass.', 2800);
    try { sfxPrecision(); } catch(e) {}
  } else {
    fTxt(P.x, P.y - P.r - 16, objProg + ' / ' + o.n, 'rgba(255,255,255,.55)');
  }
}

// PRIMORDIAL dominion sites: claim by holding near a site with no predator close.
function spawnDomSites() {
  domSites = [];
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * TAU + rng(-.4, .4), d = rng(700, 1200);
    domSites.push({ x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d, claimT: 0, claimed: false });
  }
}
function updateDomSites(dt) {
  if (P.stg !== 4 || objComplete()) return;
  for (const s of domSites) {
    if (s.claimed) continue;
    const near = dst(P, s) < 240;
    let predNear = false;
    if (near) for (const o of gNear(s.x, s.y, 320)) { if (isPred(o)) { predNear = true; break; } }
    if (near && !predNear) {
      s.claimT += dt;
      if (s.claimT >= 4000) {
        s.claimed = true;
        burst(s.x, s.y, COL.primo.pri, 26, 3.5); ring(s.x, s.y, COL.primo.pri, 180, 24);
        fTxt(s.x, s.y - 30, 'DOMINION CLAIMED', COL.primo.pri); shk(4, 240);
        objBump('territory');
      }
    } else s.claimT = Math.max(0, s.claimT - dt * 2);
  }
}
function drawDomSites(ts) {
  if (P.stg !== 4) return;
  for (const s of domSites) {
    if (!onScr(s.x, s.y, 260)) continue;
    const c = s.claimed ? COL.primo.pri : 'rgba(255,215,0,.5)';
    cx.strokeStyle = c; cx.lineWidth = s.claimed ? 1.6 : 1;
    cx.globalAlpha = s.claimed ? .5 : .3 + .15 * Math.sin(ts * .004);
    cx.setLineDash(s.claimed ? [] : [8, 10]); cx.lineDashOffset = -ts * .02;
    cx.beginPath(); cx.arc(s.x, s.y, 220, 0, TAU); cx.stroke();
    cx.setLineDash([]);
    // claim progress arc
    if (!s.claimed && s.claimT > 0) {
      cx.globalAlpha = .85; cx.lineWidth = 3; cx.strokeStyle = '#FFD700';
      cx.beginPath(); cx.arc(s.x, s.y, 220, -PI/2, -PI/2 + TAU * cl(s.claimT/4000, 0, 1)); cx.stroke();
    }
    // central sigil
    cx.globalAlpha = s.claimed ? .8 : .4;
    cx.fillStyle = c;
    cx.beginPath(); cx.arc(s.x, s.y, 7, 0, TAU); cx.fill();
    cx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════════════
// THE LIVING ECONOMY — detritus cycle.
// Kills drop detritus; food blooms where detritus settles. Kill-grounds bloom,
// blooms attract grazers, grazers attract predators: emergent migration.
// ═══════════════════════════════════════════
function dropDetritus(x, y, amt) {
  if (detritus.length >= DETRITUS_MAX) detritus.shift();
  detritus.push({ x: x + rng(-12, 12), y: y + rng(-12, 12), amt,
    vx: rng(-.08, .08), vy: rng(-.08, .08), ph: rng(0, TAU), life: 30000 });
}
function updateDetritus(dt) {
  for (let i = detritus.length - 1; i >= 0; i--) {
    const d = detritus[i];
    d.x += d.vx * (dt/16); d.y += d.vy * (dt/16); d.life -= dt; d.ph += dt * .002;
    if (d.life <= 0 || dst(P, d) > viewR * 1.4) detritus.splice(i, 1);
  }
}
// Preferred spawn anchor: settle new life near detritus when any exists.
function detritusAnchor() {
  if (!detritus.length || Math.random() < .35) return null;   // 65% bloom at detritus
  const d = detritus[rni(0, detritus.length)];
  d.life -= 4000;                                             // consumed by the bloom
  return d;
}
function drawDetritus(ts) {
  for (const d of detritus) {
    if (!onScr(d.x, d.y, 8)) continue;
    cx.globalAlpha = .14 + .08 * Math.sin(d.ph);
    cx.fillStyle = '#9fb89a';
    cx.beginPath(); cx.arc(d.x, d.y, 1.6 + (d.amt > 20 ? 1.2 : 0), 0, TAU); cx.fill();
  }
  cx.globalAlpha = 1;
}

// ═══════════════════════════════════════════
// THE EVOLVING ECOSYSTEM — selection pressure.
// The species' gene means drift away from each victim's phenotype: the player
// kills the slow → survivors breed faster. Visible in offspring bodies.
// ═══════════════════════════════════════════
function applySelection(o) {
  const g = speciesGenes[o.type]; if (!g || !o.gen) return;
  const k = 0.07;   // drift strength per kill
  g.spd  = cl(g.spd  + (g.spd  - o.gen.spd)  * k, GENE_MIN, GENE_MAX);
  g.size = cl(g.size + (g.size - o.gen.size) * k, GENE_MIN, GENE_MAX);
  g.wary = cl(g.wary + (g.wary - o.gen.wary) * k, GENE_MIN, GENE_MAX);
}

// ═══════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════
let ptr = {x:0, y:0, on:false, tap:false};
const tw = e => {
  // Guard against zm being 0 (shouldn't happen but defensive).
  // clientX/Y arrive in CSS pixels; the camera offset lives in device pixels,
  // so scale the pointer up by DPR before un-projecting through the transform.
  const z = zm || 1;
  const x = (e.clientX * DPR - off.x) / z;
  const y = (e.clientY * DPR - off.y) / z;
  return { x: isFinite(x) ? x : P.x, y: isFinite(y) ? y : P.y };
};

G.addEventListener('pointerdown', e => {
  if (paused) return;
  if (introActive) { beginGame(); return; }
  ptr.on=true; ptr.tap=true;
  const w=tw(e); ptr.x=w.x; ptr.y=w.y;
});
G.addEventListener('pointermove', e => { if (!ptr.on || paused) return; const w=tw(e); ptr.x=w.x; ptr.y=w.y; });
G.addEventListener('pointerup', () => ptr.on=false);

// ── CRITICAL: intro div sits above canvas at z-index 50, so pointerdown on the
// canvas never fires while it's visible. Attach handlers directly to the intro,
// plus a window-level fallback (covers any edge case on iOS / iframe).
const introEl = document.getElementById('intro');
const introTap = (e) => {
  if (!introActive) return;
  if (e) { e.preventDefault(); e.stopPropagation(); }
  beginGame();
};
introEl.addEventListener('pointerdown', introTap, {passive:false});
introEl.addEventListener('click', introTap);
introEl.addEventListener('touchstart', introTap, {passive:false});
addEventListener('keydown', e => {
  if (introActive && (e.key===' '||e.key==='Enter'||e.code==='Space')) { e.preventDefault(); beginGame(); }
  if (e.key==='b'||e.key==='B') bloomOn = !bloomOn;   // toggle the bloom post-process
});

// ═══════════════════════════════════════════
// PROCEDURAL AUDIO ENGINE
// ═══════════════════════════════════════════
// Fully synthesized via Web Audio API — no external files. The BGM is a layered
// generative drone that grows with the player's evolutionary stage. Game events
// (kills, hurt, evolution, frenzy, anomaly) duck, sweep, and detune the BGM in
// real time. All SFX are synthesized in-place.
//
// Stage harmonics (semitones above root A1=55Hz):
//   Mote:       [0]            — primal hum
//   Drifter:    [0, 12]        — octave forms
//   Medusa:     [0, 12, 7]     — perfect fifth blooms
//   Naga:       [0, 12, 7, 3]  — minor third tension
//   Titan:      [0, 12, 7, 3, 10]   — minor 7th, mythic
//   Primordial: [0, 12, 7, 3, 10, 19] — high sparkle, cosmic

let AC=null, A_master=null, A_bgmGain=null, A_bgmFilter=null, A_drones=[],
    A_threatGain=null, A_threatOsc=null, A_frenzyGain=null, A_frenzyTick=0,
    A_mp3Gain=null, A_mp3Source=null, A_mp3Connected=false,
    audioReady=false;
const A_ROOT = 55;  // A1
const STAGE_HARMONICS = [
  [0],
  [0, 12],
  [0, 12, 7],
  [0, 12, 7, 3],
  [0, 12, 7, 3, 10],
  [0, 12, 7, 3, 10, 19],
];
const STAGE_CUTOFF = [700, 1500, 3000, 6000, 11000, 18000];
// Drones now sit at *bed* volume — mp3 BGM (if present) carries the melody on top.
// If no mp3 loads, drones are still audible enough to feel atmospheric.
const STAGE_BGM_VOL = [.10, .12, .14, .16, .17, .19];

function freq(semis) { return A_ROOT * Math.pow(2, semis / 12); }

function initAudio() {
  if (audioReady) return;
  try {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();

    // Master chain — overall volume reduced for subtler experience
    A_master = AC.createGain();
    A_master.gain.value = muted ? 0 : .55;     // was .9 — quieter overall
    A_master.connect(AC.destination);

    // BGM bus shared by drones + mp3 — both flow through this filter so stage
    // changes ramp the spectrum on whichever source is playing.
    A_bgmFilter = AC.createBiquadFilter();
    A_bgmFilter.type = 'lowpass';
    A_bgmFilter.frequency.value = STAGE_CUTOFF[0];
    A_bgmFilter.Q.value = 0.6;
    A_bgmFilter.connect(A_master);

    A_bgmGain = AC.createGain();
    A_bgmGain.gain.value = STAGE_BGM_VOL[0];
    A_bgmGain.connect(A_bgmFilter);

    // Try to wire the <audio> element through the same filter graph
    const mp3 = document.getElementById('bgm');
    if (mp3) {
      try {
        A_mp3Gain = AC.createGain();
        A_mp3Gain.gain.value = 0.45;  // mp3 sits below master, but louder than drone bed
        A_mp3Source = AC.createMediaElementSource(mp3);
        A_mp3Source.connect(A_mp3Gain).connect(A_bgmFilter);
        A_mp3Connected = true;
        mp3.volume = 1;  // delegate volume to graph
        if (!muted) mp3.play().catch(() => { /* may need second gesture */ });
      } catch(e) { /* if route fails, fall back to element-level playback */ }
    }

    // Threat layer — low menacing tone, swells when a real predator is near
    A_threatGain = AC.createGain(); A_threatGain.gain.value = 0;
    A_threatGain.connect(A_master);
    A_threatOsc = AC.createOscillator();
    A_threatOsc.type = 'sine';                    // was sawtooth — gentler harmonic content
    A_threatOsc.frequency.value = 32;             // was 38 — pushed lower so it's felt more than heard
    const threatFilter = AC.createBiquadFilter();
    threatFilter.type = 'lowpass'; threatFilter.frequency.value = 110; threatFilter.Q.value = 2.5;   // tighter, less "static"
    A_threatOsc.connect(threatFilter).connect(A_threatGain);
    A_threatOsc.start();

    A_frenzyGain = AC.createGain(); A_frenzyGain.gain.value = 0;
    A_frenzyGain.connect(A_master);

    audioReady = true;
    buildDrones(0);
  } catch(e) { /* audio unavailable, fail silently */ }
}

function buildDrones(stg) {
  if (!audioReady) return;
  // Stop and disconnect existing drones
  for (const d of A_drones) { try { d.osc.stop(); d.osc.disconnect(); d.gain.disconnect(); } catch(e){} }
  A_drones = [];
  const harms = STAGE_HARMONICS[stg];
  const now = AC.currentTime;
  for (let i=0; i<harms.length; i++) {
    const h = harms[i];
    // Two slightly detuned oscillators per harmonic for chorus thickness
    for (const detune of [-6, 6]) {
      const osc = AC.createOscillator();
      osc.type = i === 0 ? 'sawtooth' : (i < 3 ? 'sine' : 'triangle');
      osc.frequency.value = freq(h);
      osc.detune.value = detune;
      const g = AC.createGain();
      const baseVol = (i === 0 ? .35 : .12 - i*.012) * (1 / harms.length) * 1.4;
      g.gain.value = 0;
      g.gain.setTargetAtTime(baseVol, now, 1.5);
      // Slow LFO on volume — breathing
      const lfo = AC.createOscillator();
      lfo.frequency.value = .05 + i*.013;
      const lfoG = AC.createGain();
      lfoG.gain.value = baseVol * .25;
      lfo.connect(lfoG).connect(g.gain);
      lfo.start();
      osc.connect(g).connect(A_bgmGain);
      osc.start();
      A_drones.push({ osc, gain:g, lfo, lfoG, baseVol });
    }
  }
}

function setStageAudio(stg) {
  if (!audioReady) return;
  const now = AC.currentTime;
  A_bgmFilter.frequency.cancelScheduledValues(now);
  A_bgmFilter.frequency.setValueAtTime(A_bgmFilter.frequency.value, now);
  A_bgmFilter.frequency.linearRampToValueAtTime(STAGE_CUTOFF[stg], now + 2.6);
  A_bgmGain.gain.cancelScheduledValues(now);
  A_bgmGain.gain.setValueAtTime(A_bgmGain.gain.value, now);
  A_bgmGain.gain.linearRampToValueAtTime(STAGE_BGM_VOL[stg], now + 2.0);
  // Rebuild the drone stack with new harmonics, crossfade old out
  for (const d of A_drones) {
    d.gain.gain.cancelScheduledValues(now);
    d.gain.gain.setValueAtTime(d.gain.gain.value, now);
    d.gain.gain.linearRampToValueAtTime(0, now + 1.4);
    try { d.osc.stop(now + 1.6); d.lfo.stop(now + 1.6); } catch(e){}
  }
  setTimeout(() => buildDrones(stg), 1700);
}

// Apply temporary detune / filter sweep on bgm in response to events
function audioBend(semis, dur=.4) {
  if (!audioReady) return;
  const now = AC.currentTime, cents = semis * 100;
  for (const d of A_drones) {
    d.osc.detune.cancelScheduledValues(now);
    d.osc.detune.setValueAtTime(d.osc.detune.value, now);
    d.osc.detune.linearRampToValueAtTime(cents, now + .04);
    d.osc.detune.linearRampToValueAtTime(0, now + dur);
  }
}

function audioFilterPulse(targetHz, dur=.5) {
  if (!audioReady) return;
  const now = AC.currentTime;
  const cur = A_bgmFilter.frequency.value;
  A_bgmFilter.frequency.cancelScheduledValues(now);
  A_bgmFilter.frequency.setValueAtTime(cur, now);
  A_bgmFilter.frequency.linearRampToValueAtTime(targetHz, now + .04);
  A_bgmFilter.frequency.linearRampToValueAtTime(cur, now + dur);
}

// ── SFX ──
function envOsc(type, freqArr, durs, vol, dest) {
  if (!audioReady) return;
  const now = AC.currentTime;
  const osc = AC.createOscillator();
  const g = AC.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqArr[0], now);
  for (let i=1; i<freqArr.length; i++) osc.frequency.exponentialRampToValueAtTime(Math.max(.001,freqArr[i]), now + durs[i-1]);
  const total = durs.reduce((a,b)=>a+b, 0);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(vol, now + Math.min(.01, total*.1));
  g.gain.exponentialRampToValueAtTime(.0001, now + total);
  osc.connect(g).connect(dest || A_master);
  osc.start(now); osc.stop(now + total + .05);
}

// ── EMERGENCE — the long deep drop that plays when the player materializes ──
// Sub-bass swell into a low dropping tone, paired with a slow rising filter
// shimmer. Designed to feel like a vast ancient something drawing breath.
function sfxEmerge() {
  if (!audioReady) return;  // play even if muted? no — respect mute
  if (muted) return;
  const now = AC.currentTime;

  // 1. Sub-bass swell — 200Hz → 28Hz over 1.4s (the "drop")
  const sub = AC.createOscillator();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(200, now);
  sub.frequency.exponentialRampToValueAtTime(28, now + 1.4);
  const subGain = AC.createGain();
  subGain.gain.setValueAtTime(0, now);
  subGain.gain.linearRampToValueAtTime(.32, now + .15);
  subGain.gain.linearRampToValueAtTime(.22, now + 1.0);
  subGain.gain.exponentialRampToValueAtTime(.0001, now + 2.4);
  sub.connect(subGain).connect(A_master);
  sub.start(now); sub.stop(now + 2.5);

  // 2. Second sub harmonic, slightly detuned, octave above — adds weight
  const sub2 = AC.createOscillator();
  sub2.type = 'sine';
  sub2.frequency.setValueAtTime(400, now);
  sub2.frequency.exponentialRampToValueAtTime(56, now + 1.4);
  sub2.detune.value = -8;
  const sub2Gain = AC.createGain();
  sub2Gain.gain.setValueAtTime(0, now);
  sub2Gain.gain.linearRampToValueAtTime(.10, now + .25);
  sub2Gain.gain.exponentialRampToValueAtTime(.0001, now + 2.0);
  sub2.connect(sub2Gain).connect(A_master);
  sub2.start(now); sub2.stop(now + 2.1);

  // 3. Filtered noise sweep — the rush of materialization
  const buf = AC.createBuffer(1, AC.sampleRate * 1.6, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1);
  const noise = AC.createBufferSource(); noise.buffer = buf;
  const noiseFilt = AC.createBiquadFilter();
  noiseFilt.type = 'bandpass';
  noiseFilt.frequency.setValueAtTime(3500, now);
  noiseFilt.frequency.exponentialRampToValueAtTime(150, now + 1.2);
  noiseFilt.Q.value = 3;
  const noiseGain = AC.createGain();
  noiseGain.gain.setValueAtTime(0, now);
  noiseGain.gain.linearRampToValueAtTime(.06, now + .2);
  noiseGain.gain.exponentialRampToValueAtTime(.0001, now + 1.5);
  noise.connect(noiseFilt).connect(noiseGain).connect(A_master);
  noise.start(now); noise.stop(now + 1.6);

  // 4. Bend the entire BGM down a 4th and let it return — feels like reality flexes
  audioBend(-5, 1.6);
}

// FX HELPERS
// ═══════════════════════════════════════════
function burst(x, y, c, n=10, s=2) {
  for (let i=0; i<n && parts.length<240; i++) {
    const a=Math.random()*TAU, sp=rng(.3,s);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:rng(.5,3),life:rng(200,500),ml:500,c,t:'c'});
  }
}
function ring(x, y, c, rad, n=12) {
  for (let i=0; i<n && parts.length<240; i++) {
    const a=(i/n)*TAU;
    parts.push({x:x+Math.cos(a)*rad,y:y+Math.sin(a)*rad,vx:Math.cos(a),vy:Math.sin(a),r:1.5,life:300,ml:300,c,t:'c'});
  }
}
function fTxt(x, y, t, c) { if (txts.length<30) txts.push({x,y,t,c,life:900,ml:900}); }
// Centre-screen announcement banner — reuses the evolution announce box for any
// titled callout (stage phases, system unlocks, etc.).
function announce(title, color, sub, dur=2600) {
  const eT=document.getElementById('evoT'), eS=document.getElementById('evoS'), eA=document.getElementById('evoAnn');
  eT.textContent=title; eT.style.color=color; eS.textContent=sub||'';
  eA.style.opacity='1'; setTimeout(()=>{eA.style.opacity='0';}, dur);
}
function shk(i, d) {
  // Hard-cap shake intensity at 5px so the player never appears to leap out of
  // their own frame. Big events still feel impactful via flash/particles/audio.
  shi = Math.max(shi, Math.min(i, 5));
  shd = Math.max(shd, Math.min(d, 350));
}

// ═══════════════════════════════════════════
// BOIDS / FLOCKING
// ═══════════════════════════════════════════
// Eat threshold widens with evolution. Earlier stages must hunt clearly-smaller
// prey; later stages can swallow opponents nearer their own size. This adds
// gameplay-relevant identity to each stage's feeding strategy:
//   MOTE/DRIFTER: 0.80× — must find food clearly smaller
//   MEDUSA:       0.85× — sting + slightly wider mouth lets you eat tendrils/small hunters
//   NAGA:         0.85× — same threshold, lash extends effective reach
//   TITAN:        0.88× — bite threshold for sizeable prey; small prey are filter-fed
//   PRIMORDIAL:   0.90× — apex predator
const EAT_RATIO = [0.80, 0.80, 0.85, 0.85, 0.90, 0.88];  // idx4 PRIMORDIAL (apex) · idx5 TITAN (filter-feeder)
function canEat(o) { return o.r < P.r * (EAT_RATIO[P.stg] || 0.80); }
function isPred(o) { return o.r > P.r * 1.2; }

// ═══════════════════════════════════════════
// SENSE / RADAR SYSTEM
// Unlocks at stage 1 (Drifter). Range and precision scale with evolution.
// Level 1: short range, basic prey/predator coloring
// Level 2: longer range, vulnerable-angle hints on marginal prey
// Level 3+: pierces same-color camouflage clusters
// Level 4+: predator trajectories
// Level 5:  effectively omniscient
// ═══════════════════════════════════════════
const SENSE_RANGE = [0, 200, 320, 440, 580, 800];

// Color families — used for camouflage masking. Smaller creatures of the same
// family as a larger creature can cluster near it; their radar signature dims.
const COLOR_FAMILY = {
  bloom:'green', mote:'green',
  polyp:'yellow', lurker:'yellow',
  tendril:'pink', phantom:'pink',
  hunter:'red', behemoth:'red',
  levia:'blue',
  echo:'white',
  grazer:'green',
};

// Vulnerable angle per creature type (relative to the prey's heading).
// 0 = head-on, PI = directly behind, PI/2 = right flank, -PI/2 = left flank.
// `w` is the arc width (radians). w >= TAU means no preferred angle.
const VULN = {
  bloom:    { ang:0,    w:TAU  }, // omni-edible
  mote:     { ang:0,    w:TAU  },
  polyp:    { ang:0,    w:TAU  },
  tendril:  { ang:PI/2, w:1.4  }, // flanks (bell mouth faces forward)
  hunter:   { ang:PI,   w:1.6  }, // tail strike
  lurker:   { ang:0,    w:1.1  }, // frontal — the lure dangles forward, exposed
  phantom:  { ang:PI,   w:1.4  }, // behind the veil
  echo:     { ang:PI,   w:0.9  }, // narrow rear seam
  levia:    { ang:PI,   w:1.2  }, // tail flukes
  behemoth: { ang:PI,   w:0.7  }, // tiny apex weakspot
  grazer:   { ang:0,    w:TAU  }, // omni-edible — it's meant to be a free meal
};

function canEatAngle(o) {
  // Marginal-size kill: only succeeds when player approaches from the prey's
  // vulnerable side. Requires sense level ≥ 1 (visible cue) but works without it.
  if (o.r < P.r * .8) return false;        // standard kill range handles this
  if (o.r >= P.r * 1.08) return false;     // too large entirely
  const v = VULN[o.type];
  if (!v || v.w >= TAU - 0.01) return false;
  const a = ang(o, P);                     // direction from prey to player
  const target = o.hd + v.ang;
  const df = Math.abs(Math.atan2(Math.sin(a - target), Math.cos(a - target)));
  return df < v.w / 2;
}

function senseRange() { return (SENSE_RANGE[P.stg] || 0) * traitStats(P).senseMul; }
function senseLevel() { return P.stg; }

function updateSense() {
  const range = senseRange(), lvl = senseLevel();
  for (const o of orgs) {
    o._maskAnchor = null;
    if (range === 0) { o._inRange=false; o._edib=0; o._pred=0; o._maskHide=0; continue; }
    const d = dst(P, o);
    o._inRange = d < range;
    if (!o._inRange) { o._edib=0; o._pred=0; o._maskHide=0; continue; }
    o._edib = canEat(o) ? 1 : (canEatAngle(o) ? 0.5 : 0);
    o._pred = isPred(o) ? 1 : 0;

    // Camouflage check — same color family, larger anchor nearby
    const fam = COLOR_FAMILY[o.type];
    o._maskHide = 0;
    if (fam && o.r < 22) {
      let best=null, bestD=110;
      for (const m of gNear(o.x, o.y, 110)) {
        if (m===o || m.r < o.r*1.5) continue;
        if (COLOR_FAMILY[m.type] !== fam) continue;
        const md = dst(o, m);
        if (md < bestD) { best=m; bestD=md; }
      }
      if (best) {
        o._maskAnchor = best;
        // Higher sense level pierces the mask. Lower stages see it dimmed.
        const fade = 1 - bestD/110;
        o._maskHide = lvl >= 3 ? 0 : fade * 0.78;
      }
    }
  }
}

function boids(o) {
  const T = ORGS[o.type]; if (!T.school) return {fx:0,fy:0};
  const schR = T.schR||100;
  let sepX=0,sepY=0,sepN=0,aliX=0,aliY=0,cohX=0,cohY=0,n=0;
  const nb = gNear(o.x, o.y, schR);
  for (const q of nb) {
    if (q===o || q.type!==o.type) continue;
    const ddx=q.x-o.x, ddy=q.y-o.y, dd=Math.hypot(ddx,ddy);
    if (dd>schR || dd<.1) continue;
    if (dd<schR*.35) { const w=1-dd/(schR*.35); sepX-=(ddx/dd)*w; sepY-=(ddy/dd)*w; sepN++; }
    aliX+=Math.cos(q.hd); aliY+=Math.sin(q.hd); cohX+=q.x; cohY+=q.y; n++;
  }
  let fx=0, fy=0;
  if (sepN>0) { fx+=sepX/sepN*1.8; fy+=sepY/sepN*1.8; }
  if (n>0) {
    fx+=(aliX/n-Math.cos(o.hd))*.6; fy+=(aliY/n-Math.sin(o.hd))*.6;
    const c2x=cohX/n-o.x, c2y=cohY/n-o.y, c2d=Math.hypot(c2x,c2y);
    if (c2d>1) { fx+=(c2x/c2d)*.4; fy+=(c2y/c2d)*.4; }
  }
  if (canEat(o)) {
    const pd=dst(P,o), flR=100+P.r*2.5;
    if (pd<flR) {
      o.scatterT=800;
      for (const q of gNear(o.x,o.y,schR)) if(q.type===o.type) q.scatterT=Math.max(q.scatterT,600);
    }
  }
  if (o.scatterT>0) {
    fx*=.2; fy*=.2;
    const fa=ang(P,o), u=o.scatterT/800;
    fx+=Math.cos(fa)*3*u; fy+=Math.sin(fa)*3*u;
  }
  return {fx, fy};
}

// ═══════════════════════════════════════════
// ORGANISM AI
// ═══════════════════════════════════════════
function findOrgPrey(o) {
  const pp=PREY_OF[o.type]; if (!pp) return null;
  const huntR=ECO_HUNT_R[o.type]||120;
  const nb=gNear(o.x,o.y,huntR); let best=null, bestD=huntR;
  for (const q of nb) {
    if (q===o || !pp.includes(q.type) || q.r>=o.r*.9) continue;
    const dd=dst(o,q); if(dd<bestD){bestD=dd;best=q;}
  }
  return best;
}

function aiOrg(o, dt) {
  const T=ORGS[o.type], dist=dst(P,o);
  const smaller=canEat(o), bigger=isPred(o);
  if (o._grabbed) o._grabbed = Math.max(0, o._grabbed - dt*.004);   // arm-grab flag fades
  // Genome modulation: spd gene quickens the body; wary gene widens flight distance.
  const g = o.gen || { spd:1, size:1, wary:1 };
  const spd=T.spd*g.spd*(o.stunT>0?.15:1);
  o.stT-=dt; o.stunT=Math.max(0,o.stunT-dt); o.flT=Math.max(0,o.flT-dt);
  o.ph+=dt*.003; o.finPh+=dt*.006; o.breathPh+=dt*.004; o.scatterT=Math.max(0,o.scatterT-dt);
  const te=ang(o,P), ed=Math.atan2(Math.sin(te-o.eyeAng),Math.cos(te-o.eyeAng));
  o.eyeAng+=ed*Math.min(1,dt*.005);
  if (Math.random()<.04 && o.trail.length<6) o.trail.push({x:o.x,y:o.y,l:250});
  for (let i=o.trail.length-1; i>=0; i--) { o.trail[i].l-=dt; if(o.trail[i].l<=0)o.trail.splice(i,1); }
  if (T.school) {
    const nb=gNear(o.x,o.y,T.schR||100);
    for (const q of nb) { if(q===o||q.type!==o.type)continue; o.breathPh+=Math.sin(q.breathPh-o.breathPh)*.02; break; }
  }

  let tx=o.x, ty=o.y;
  const fleeR=smaller ? (100+P.r*2.5)*g.wary : 0;   // wary genes flee earlier
  const huntR=bigger  ? 180+o.r*3   : 0;

  // ═══ UTILITY AI (rebuilt) ═══════════════════════════════════════════════
  // Four signature species keep their authored identity as hooks; everyone
  // else scores its drives each frame — flee / hunt / forage / wander — and
  // steers toward the winner. Genome modulates the scores, so selection
  // pressure (speciesGenes drifting) changes behavior, not just bodies.
  let handled = true;
  switch (T.beh) {
    case 'ambush':   // lurker: dead-still lure, explosive burst
      if (smaller&&dist<fleeR) { const fa=ang(P,o); tx=o.x+Math.cos(fa)*spd*3; ty=o.y+Math.sin(fa)*spd*3; o.ambR=false; o.stT=2000; }
      else if (o.ambR) {
        o.lAng+=dt*.003;
        if ((bigger||(!smaller&&!bigger))&&dist<65) { o.ambR=false; o.stT=2200; const ha=ang(o,P); o.vx=Math.cos(ha)*6; o.vy=Math.sin(ha)*6; burst(o.x,o.y,T.col,6,2); shk(2,50); }
      } else {
        o.wAng+=(Math.random()-.5)*.02*dt; tx=o.x+Math.cos(o.wAng)*spd; ty=o.y+Math.sin(o.wAng)*spd;
        if (o.stT<=0) o.ambR=true;
      } break;
    case 'lure':     // phantom: false food trail, then the veil closes
      if (smaller&&dist<fleeR) { const fa=ang(P,o); tx=o.x+Math.cos(fa)*spd*2.5; ty=o.y+Math.sin(fa)*spd*2.5; }
      else if (bigger) {
        if (dist>250) {
          if (Math.random()<.007&&parts.length<180) parts.push({x:lp(o.x,P.x,.6)+rng(-20,20),y:lp(o.y,P.y,.6)+rng(-20,20),vx:0,vy:0,r:3,life:1500,ml:1500,c:'#6AE856',t:'lure'});
          const ha=ang(o,P); tx=o.x+Math.cos(ha)*spd*.4; ty=o.y+Math.sin(ha)*spd*.4;
        } else { const ha=ang(o,P); tx=o.x+Math.cos(ha)*spd*2; ty=o.y+Math.sin(ha)*spd*2; }
      } else { o.wAng+=(Math.random()-.5)*.03*dt; tx=o.x+Math.cos(o.wAng)*spd; ty=o.y+Math.sin(o.wAng)*spd; } break;
    case 'apex':     // behemoth: predictive charge
      if (smaller&&dist<fleeR) { const fa=ang(P,o); tx=o.x+Math.cos(fa)*spd*3; ty=o.y+Math.sin(fa)*spd*3; }
      else if (bigger&&dist<huntR) {
        const px=P.x+P.vx*30, py=P.y+P.vy*30, ha=Math.atan2(py-o.y,px-o.x);
        tx=o.x+Math.cos(ha)*spd*1.6; ty=o.y+Math.sin(ha)*spd*1.6;
        if (dist<150&&o.stT<=0) { o.vx=Math.cos(ha)*5; o.vy=Math.sin(ha)*5; o.stT=1800; burst(o.x,o.y,T.col,8,3); shk(3,80); }
      } else { const oa=ang(o,P)+PI/3; tx=o.x+Math.cos(oa)*spd; ty=o.y+Math.sin(oa)*spd; } break;
    case 'mirror':   // echo: replays your own past movement against you
      if (smaller&&dist<fleeR) { const fa=ang(P,o); tx=o.x+Math.cos(fa)*spd*2.5; ty=o.y+Math.sin(fa)*spd*2.5; }
      else if (behMem.length>=10) {
        const s=behMem[rni(0,behMem.length)], ch=Math.sin(gt*.002)*.7;
        tx=o.x+s.vx*-1+Math.sin(gt*.003+o.x)*ch; ty=o.y+s.vy*-1+Math.cos(gt*.003+o.y)*ch;
        if (Math.random()<.012) { const ha=ang(o,P); o.vx+=Math.cos(ha)*4; o.vy+=Math.sin(ha)*4; }
      } break;
    default: handled = false;
  }

  if (!handled) {
    // ── Score the drives ──
    const sFlee = (smaller && dist < fleeR) ? (1 - dist/fleeR) * 1.6 * g.wary : 0;
    const sHunt = (bigger  && dist < huntR) ? (1 - dist/huntR) * 1.25 / g.wary : 0;
    // Forage: nearest detritus draws life in — this is what makes kill-grounds
    // bloom into gathering places (the living economy made visible).
    let fd = null, fdd = 170;
    if (sFlee < .4 && detritus.length) {
      for (const dd0 of detritus) {
        const ddd = dst(o, dd0); if (ddd < fdd) { fdd = ddd; fd = dd0; }
      }
    }
    const sForage = fd ? (1 - fdd/170) * .55 : 0;
    const sWander = .25;

    const top = Math.max(sFlee, sHunt, sForage, sWander);
    if (top === sFlee) {
      const u = 1 - dist/fleeR, fa = ang(P,o);
      const zz = (T.beh==='chase') ? Math.sin(gt*.005)*.6 : 0;      // hunters jink as they flee
      tx = o.x + Math.cos(fa+zz)*spd*(2+u*4); ty = o.y + Math.sin(fa+zz)*spd*(2+u*4);
    } else if (top === sHunt) {
      const m = dist<100 ? 1.8 : 1.2, ha = ang(o,P);
      tx = o.x + Math.cos(ha)*spd*m; ty = o.y + Math.sin(ha)*spd*m;
    } else if (top === sForage) {
      const fa = ang(o, fd);
      tx = o.x + Math.cos(fa)*spd*.8; ty = o.y + Math.sin(fa)*spd*.8;
    } else {
      // Wander, flavored per species: pulse species kick rhythmically, grazers amble.
      const wj = T.beh==='bloom'?.008 : T.beh==='graze'?.004 : T.beh==='passive'?.006 : .03;
      o.wAng += (Math.random()-.5)*wj*dt;
      let wm = T.beh==='swarm'||T.beh==='chase' ? .5 : 1;
      if (T.beh==='pulse') { wm = Math.abs(Math.sin(o.breathPh*2))*2; if (o.stT<=0){ o.wAng+=(Math.random()-.5)*1.5; o.stT=rng(1000,2500);} }
      tx = o.x + Math.cos(o.wAng)*spd*wm; ty = o.y + Math.sin(o.wAng)*spd*wm;
    }
  }

  // Ecosystem hunting
  if (dist>fleeR*1.5 && dist>huntR*1.2 && PREY_OF[o.type]) {
    const prey=findOrgPrey(o);
    if (prey) { const ha=ang(o,prey); tx=lp(tx,o.x+Math.cos(ha)*spd*1.5,.4); ty=lp(ty,o.y+Math.sin(ha)*spd*1.5,.4); }
  }
  // Flee organism predators
  if (T.school||T.beh==='drift'||T.beh==='bloom') {
    for (const pred of gNear(o.x,o.y,120)) {
      if (pred===o) continue;
      const pp=PREY_OF[pred.type]; if(!pp||!pp.includes(o.type)||pred.r<o.r*.9) continue;
      const pd=dst(o,pred), oFlR=60+pred.r*2;
      if (pd<oFlR) { const fa=ang(pred,o),u=1-pd/oFlR; tx+=Math.cos(fa)*spd*(1+u*2); ty+=Math.sin(fa)*spd*(1+u*2); break; }
    }
  }

  const fl=boids(o);
  o.vx=o.vx*.9+((tx-o.x)*.04+fl.fx*.3);
  o.vy=o.vy*.9+((ty-o.y)*.04+fl.fy*.3);

  // ── Camouflage seek: when player is sensed, drift toward same-color larger anchor ──
  if (o._maskAnchor) {
    const pD = dst(P, o);
    if (pD < 320) {
      const ma = ang(o, o._maskAnchor);
      const md = dst(o, o._maskAnchor);
      const ideal = o._maskAnchor.r + o.r + 8;
      const offset = md - ideal;
      const pull = .055 * (1 - cl(pD/320, 0, 1));
      o.vx += Math.cos(ma) * pull * Math.sign(offset||1);
      o.vy += Math.sin(ma) * pull * Math.sign(offset||1);
    }
  }

  o.x+=o.vx*(dt/16); o.y+=o.vy*(dt/16);
  o.hd=Math.atan2(o.vy,o.vx);
  { const big=P.stg===5, cull=big?viewR*1.15:2200;
    if (dst(P,o)>cull) { const a=Math.random()*TAU, dd=big?rng(viewR*.5,viewR*1.05):rng(500,T.spW); o.x=P.x+Math.cos(a)*dd; o.y=P.y+Math.sin(a)*dd; o.hp=o.mhp; o.ambR=T.beh==='ambush'; } }
}

// ═══════════════════════════════════════════
// PLAYER UPDATE
// ═══════════════════════════════════════════
// ═══════════════════════════════════════════
// MASS EQUATIONS — rebuilt (docs/REBUILD_SPINE.md).
// One smooth power law for decay, one centralized reward function. The old
// piecewise decay hid two catastrophic coefficient typos over its life; a
// single curve can't have seams to get wrong.
// ═══════════════════════════════════════════
function calcR(mass, bR)   { return bR + Math.log2(Math.max(1,mass)) * 2.8; }

// Decay per ms: 0.0005 · (m/100)^0.75 — smooth from microbe to titan:
//   m=100 → 0.5/s · m=400 → 1.4/s · m=850 → 2.5/s · m=1500 → 3.8/s · m=2500 → 5.6/s
function calcDecay(m, dt) {
  return .0005 * Math.pow(Math.max(1, m) / 100, .75) * dt;
}

// Legacy gain shape (hyperbolic damping by player mass); kept because several
// call sites use it directly. Prefer killReward() for kills.
function calcGain(bm, pm)  { return bm * (1 / (1 + pm * .0014)); }

// THE one reward function for killing/eating a creature. preyMass is its base
// mass (× elder multiplier at call sites), mhp its max HP (toughness = effort).
// Tough prey both multiplies the reward AND resists the player-mass damping, so
// apex hunts stay worth it at any size — the fix the flat formulas kept needing.
function killReward(preyMass, mhp, pm) {
  const effort = cl((mhp || 1) / 50, 0, 1);          // 0 fodder → 1 behemoth-tier
  const mult   = 1 + effort * 4;                     // ×1 → ×5
  const damp   = 1 + pm * .0014 * (1 - effort * .6); // apex resists lategame damping
  return preyMass * mult / damp;
}

function updateP(dt) {
  // ── Micro branch takes over the player loop once we leave the single body ──
  if (microMode === 'swarm') { ptr.tap = false; updateSwarm(dt); return; }
  // microMode==='choice' is handled by the paused singularity fork overlay
  // (openSingularityFork) — no in-world tap handling needed here.

  const s=stg(); let dx=0, dy=0;
  if (ptr.on) { dx=ptr.x-P.x; dy=ptr.y-P.y; }
  const dL=Math.hypot(dx,dy); if(dL>.5) P.hd=Math.atan2(dy,dx);
  // Tap activates an ability if the actor has either a legacy stage ability or
  // any activated trait. The trait engine (traitTap, inside useAbil) gets first dibs.
  if (ptr.tap && ((s.ab && s.cd>0) || P.traits.length)) useAbil();
  ptr.tap=false;
  traitTick(P, dt);
  updateBreakPressure(dt);
  const tstats = traitStats(P);   // passive trait modifiers (spd/decay/dmgTaken/senseMul)

  let spd=s.spd*(1+Math.log2(Math.max(1,P.mass))*.08)*tstats.spd;
  if (P.dash) { spd*=2.5; P.dashT-=dt; if(P.dashT<=0)P.dash=false; }
  if (P.boost>0) { spd*=1.2; P.boost=Math.max(0,P.boost-dt); }
  if (frenzy) spd *= 1.4;
  if (dL>2) { P.vx=lp(P.vx,dx/dL*spd,.1); P.vy=lp(P.vy,dy/dL*spd,.1); } else { P.vx*=.9; P.vy*=.9; }

  // Hard velocity cap — prevents any combo of multipliers from launching the
  // player so fast they outrun the camera lerp on a single frame.
  const MAX_V = 24;
  if (P.vx > MAX_V) P.vx = MAX_V; else if (P.vx < -MAX_V) P.vx = -MAX_V;
  if (P.vy > MAX_V) P.vy = MAX_V; else if (P.vy < -MAX_V) P.vy = -MAX_V;

  P.x+=P.vx*(dt/16); P.y+=P.vy*(dt/16);

  // NaN guard — if anything ever goes wrong with the math, recover gracefully.
  if (!isFinite(P.x) || !isFinite(P.y)) { P.x = 0; P.y = 0; P.vx = 0; P.vy = 0; }

  P.r=calcR(P.mass, s.bR);
  // TITAN balloons physically — calcR alone is logarithmic and tops out near r42,
  // far too small for the camera to ever pull back. This super-linear bonus makes
  // the giant genuinely dwarf its world, which is what drives the zoom-out and lets
  // the filter-ratio treat the old fauna as plankton. (PRIMORDIAL handles its own
  // scale in Phase 2.)
  if (P.stg===5) P.r += Math.max(0, P.mass - STAGES[5].thr) * 0.085;  // gentler balloon — TITAN is the relaxed endgame

  const floor=STAGES[P.stg].thr*.78+3;
  P.mass=Math.max(floor, P.mass-calcDecay(P.mass,dt)*tstats.decay);
  // The cycle closes: a sliver of what you shed settles behind you as detritus,
  // seeding blooms along your wake. Life follows where you've been.
  if (Math.random() < dt * .0006 && P.mass > 60) dropDetritus(P.x - P.vx*8, P.y - P.vy*8, 6);
  P.tail.unshift({x:P.x, y:P.y});
  while (P.tail.length > Math.floor(16+Math.log2(Math.max(1,P.mass))*8)) P.tail.pop();

  P.blink=Math.max(0,P.blink-dt); abil_cd=Math.max(0,abil_cd-dt);
  if (P.flash.t>0) P.flash.t-=dt;
  streakT=Math.max(0,streakT-dt); if(streakT<=0)streak=0;

  // Passive abilities
  if (s.ab==='sting') {
    // Sting aura kills small prey passively as they brush against you.
    // This is the key Medusa survival/feeding mechanic to break the difficulty wall.
    // Range scaled with mass so larger Medusas reap larger sting zones.
    const range = P.r * 3.4;
    for (const o of gNear(P.x, P.y, range)) {
      const d = dst(P, o);
      if (d >= range) continue;
      if (o.r >= P.r * 0.95) continue;     // only affects smaller creatures
      // Closer = stronger sting. Smaller = more vulnerable.
      const intensity = 1 - d/range;
      o.stunT = Math.max(o.stunT, 500);
      if (Math.random() < 0.08 * intensity) {
        o.hp -= 0.5 + intensity * 0.6;
        o.flT = 140;
      }
      // Tiny visual pull — sting drags prey gently toward you
      if (d > 4) {
        const pa = ang(o, P);
        o.vx += Math.cos(pa) * 0.04 * intensity;
        o.vy += Math.sin(pa) * 0.04 * intensity;
      }
    }
  }
  // ── TITAN: filter-feeder phase tracking + Colossus auto-echo ──
  if (P.stg===5) {
    const wasColossus = titanPhase;
    titanPhase = P.mass >= TITAN_COLOSSUS ? 1 : 0;
    if (titanPhase===1 && !wasColossus && !titanColossusShown) {
      titanColossusShown = true;
      announce('COLOSSUS', '#5AC8FF', 'The board is plankton now. Filter the deep.', 3200);
      shk(7, 500); ring(P.x, P.y, '#5AC8FF', P.r*2.2, 24); audioBend(3, 1.4);
    }
    // In Colossus the stun-echo pulses on its own — the giant is too vast to aim.
    if (titanPhase===1) { titanEchoT -= dt; if (titanEchoT <= 0) { titanEchoT = 2600; stunEcho(true); } }
  } else { titanPhase = 0; }
  behMem.push({vx:P.vx,vy:P.vy,hd:P.hd}); if(behMem.length>120)behMem.shift();
}

// ═══════════════════════════════════════════
// TRAIT ENGINE — the adaptation system (see docs/TRAIT_SYSTEM.md)
// Traits are data + optional hooks held on an ACTOR (never globals), so the same
// code drives P, and later P2/P3… (multiplayer principle #1). Adding a fork =
// adding a registry entry; the core loop never changes. This is what keeps the
// number of evolutionary directions open-ended.
// ═══════════════════════════════════════════
// Hook contract (all optional, all take the actor `a` first):
//   onTap(a)         — activated ability; return true if it consumed the tap
//   onTick(a, dt)    — every frame (auras, regen, passive procs)
//   onKill(a, prey)  — when the actor kills a creature
//   mod(a, st)       — fold passive modifiers into a stats object st {spd,decay,...}
//   draw(a, ts)      — per-trait world-space visual
//   cd               — cooldown (ms) for activated traits; tracked per-actor in a.traitCd
const TRAITS = {
  bolt: {
    id:'bolt', name:'Bolt', cat:'acquisition', max:3, cd:400,
    desc:'Fire a damaging projectile at the cursor.',
    onTap(a) {
      const lv = a.traitLv.bolt || 1;
      const aim = ang(a, ptr.on ? ptr : { x:a.x+Math.cos(a.hd)*100, y:a.y+Math.sin(a.hd)*100 });
      const spread = lv >= 3 ? [-.18, 0, .18] : lv >= 2 ? [-.10, .10] : [0];  // stacks → more shots
      for (const off of spread) {
        const an = aim + off;
        projs.push({ x:a.x+Math.cos(an)*a.r, y:a.y+Math.sin(an)*a.r,
          vx:Math.cos(an)*8, vy:Math.sin(an)*8, r:4, life:1200, dmg:8, c:COL.primo.pri });
      }
      burst(a.x+Math.cos(aim)*a.r, a.y+Math.sin(aim)*a.r, COL.primo.pri, 4, 1.2);
      shk(1.5, 40);
      return true;
    },
  },

  // ── ACQUISITION: gravity well — pull small prey inward (the TITAN technique,
  //    now a chooseable trait). Opposite of bolt: passive, area, no aim.
  gravity_well: {
    id:'gravity_well', name:'Gravity Well', cat:'acquisition', max:3,
    desc:'Continuously draw smaller prey toward you. Stacks widen the well.',
    onTick(a, dt) {
      const lv = a.traitLv.gravity_well || 1;
      const R = a.r * (4 + lv * 1.2);
      for (const o of gNear(a.x, a.y, R)) {
        const d = dst(a, o); if (d < 4 || d > R || o.r > a.r * .8) continue;
        const pull = .35 * lv * (1 - d / R), ga = ang(o, a);
        o.vx += Math.cos(ga) * pull; o.vy += Math.sin(ga) * pull;
      }
    },
    draw(a, ts) {
      const lv = a.traitLv.gravity_well || 1, R = a.r * (4 + lv * 1.2);
      cx.globalAlpha = .05 + .03 * Math.sin(ts * .003);
      cx.strokeStyle = COL.titan.pri; cx.lineWidth = .6;
      for (let i = 0; i < lv + 1; i++) { cx.beginPath(); cx.arc(a.x, a.y, R * (1 - i * .18), 0, TAU); cx.stroke(); }
      cx.globalAlpha = 1;
    },
  },

  // ── ACQUISITION: venom — kills leave a damaging spore cloud; stacks linger longer.
  venom_tip: {
    id:'venom_tip', name:'Venom', cat:'acquisition', max:3,
    desc:'Your kills burst into a damaging spore cloud.',
    onKill(a, prey) {
      const lv = a.traitLv.venom_tip || 1;
      for (const o of gNear(prey.x, prey.y, 60 + lv * 18)) {
        if (o === prey || !orgs.includes(o)) continue;
        if (dst(prey, o) < 60 + lv * 18) { o.hp -= 1.2 * lv; o.flT = 160; o.stunT = Math.max(o.stunT, 200); }
      }
      for (let i = 0; i < 6 + lv * 2; i++) { const an = rng(0, TAU), d = rng(0, 40 + lv * 15);
        parts.push({ x: prey.x + Math.cos(an)*d, y: prey.y + Math.sin(an)*d, vx: 0, vy: 0,
          r: rng(1, 2.6), life: 600 + lv * 200, ml: 600 + lv * 200, c: '#9CE84A', t: 'c' }); }
    },
  },

  // ── DEFENSE: membrane — passive armor (less damage taken). Pure stat mod.
  membrane: {
    id:'membrane', name:'Membrane', cat:'defense', max:3,
    desc:'A toughened membrane. Take less damage from predators.',
    mod(a, st) { st.dmgTaken *= (1 - .22 * (a.traitLv.membrane || 1)); },
  },

  // ── METABOLISM: efficient — slower mass decay. Pure stat mod.
  efficient: {
    id:'efficient', name:'Efficient Digestion', cat:'metabolism', max:3,
    desc:'Burn mass more slowly. Decay is reduced.',
    mod(a, st) { st.decay *= (1 - .18 * (a.traitLv.efficient || 1)); },
  },

  // ── MOVEMENT: fins — passive speed. Pure stat mod.
  fins: {
    id:'fins', name:'Fins', cat:'movement', max:3,
    desc:'Streamlined fins. Move faster.',
    mod(a, st) { st.spd *= (1 + .12 * (a.traitLv.fins || 1)); },
  },

  // ── SENSES: deep-scan — extends radar/sense range. Pure stat mod.
  deepscan: {
    id:'deepscan', name:'Deep Scan', cat:'senses', max:3,
    desc:'Sharper senses. Radar range extends.',
    mod(a, st) { st.senseMul *= (1 + .25 * (a.traitLv.deepscan || 1)); },
  },

  // ── ACQUISITION: octopus arms. Grows grasping tentacles that extend your eat
  //    reach AND haul nearby edible prey toward your maw. Each stack = +2 arms,
  //    more reach, stronger pull. The classic octopus "arms grab more" fantasy.
  arms: {
    id:'arms', name:'Grasping Arms', cat:'acquisition', max:3,
    desc:'Octopus arms. Longer reach; they haul prey into your grasp.',
    mod(a, st) { st.reach *= (1 + .35 * (a.traitLv.arms || 1)); },   // +35% eat reach per stack
    onTick(a, dt) {
      const lv = a.traitLv.arms || 1;
      const grip = a.r * (1.8 + lv * 0.9);      // reach of the arms
      for (const o of gNear(a.x, a.y, grip)) {
        const dd = dst(a, o); if (dd < a.r || dd > grip) continue;
        if (o.r >= a.r * 0.95) continue;        // can only grab things you could eat
        const pull = (.12 + lv * .06) * (1 - dd/grip);
        const ga = ang(o, a);
        o.vx += Math.cos(ga) * pull; o.vy += Math.sin(ga) * pull;
        o._grabbed = 2;                          // renderer draws an arm to it
      }
    },
    draw(a, ts) {
      const lv = a.traitLv.arms || 1;
      const nArms = 2 + lv * 2;                  // 4 / 6 / 8 arms
      const reach = a.r * (1.8 + lv * 0.9);
      cx.save(); cx.lineCap = 'round';
      const colr = stg().c.pri;
      // Idle arms fan out behind/around the body, undulating like an octopus.
      for (let i = 0; i < nArms; i++) {
        const base = a.hd + PI + (i - (nArms-1)/2) * (0.55);   // splay behind heading
        // Does this arm reach for a grabbed target? Find one in its arc.
        let tgt = null, td = reach;
        for (const o of gNear(a.x, a.y, reach)) {
          if (!o._grabbed) continue;
          const oa = ang(a, o), df = Math.abs(Math.atan2(Math.sin(oa-base), Math.cos(oa-base)));
          if (df < 0.9) { const dd = dst(a,o); if (dd < td) { td = dd; tgt = o; } }
        }
        const len = tgt ? td : reach * (.45 + .12*Math.sin(ts*.004 + i));
        const ang0 = tgt ? ang(a, tgt) : base + Math.sin(ts*.003 + i*1.3) * 0.25;
        // Three-segment curl
        const x0 = a.x + Math.cos(a.hd)* -a.r*.2, y0 = a.y + Math.sin(a.hd)* -a.r*.2;
        const mx = x0 + Math.cos(ang0)*len*.5 + Math.cos(ang0+PI/2)*Math.sin(ts*.005+i)*len*.12;
        const my = y0 + Math.sin(ang0)*len*.5 + Math.sin(ang0+PI/2)*Math.sin(ts*.005+i)*len*.12;
        const ex = x0 + Math.cos(ang0)*len, ey = y0 + Math.sin(ang0)*len;
        cx.strokeStyle = colr;
        cx.globalAlpha = tgt ? .6 : .35;
        cx.lineWidth = Math.max(1.2, a.r*.16) * (tgt ? 1.2 : 1);
        cx.shadowBlur = 6*zm; cx.shadowColor = colr;
        cx.beginPath(); cx.moveTo(x0, y0); cx.quadraticCurveTo(mx, my, ex, ey); cx.stroke();
        // suction tip
        cx.fillStyle = tgt ? '#fff' : colr; cx.globalAlpha = tgt ? .8 : .5;
        cx.beginPath(); cx.arc(ex, ey, Math.max(1.4, a.r*.09), 0, TAU); cx.fill();
      }
      cx.restore(); cx.globalAlpha = 1; cx.shadowBlur = 0;
    },
  },
};

// Fold all passive trait modifiers into a stats object. Callers read these
// instead of hardcoding, so traits compose. Defaults = identity (no traits → no change).
function traitStats(a) {
  const st = { spd: 1, decay: 1, dmgTaken: 1, senseMul: 1, eatRatio: 1, reach: 1 };
  for (const id of a.traits) { const t = TRAITS[id]; if (t && t.mod) t.mod(a, st); }
  return st;
}

// Per-stage seed traits — the default (linear) path grants these so nothing
// regresses while the choice UI is still being built. Migrating one ability
// (bolt at PRIMORDIAL=4) proves the engine; the rest stay on the legacy switch
// for now and move over in the next step.
const STAGE_SEED_TRAITS = { 4: ['bolt'] };

function grantTrait(a, id) {
  const def = TRAITS[id]; if (!def) return;
  if (!a.traits.includes(id)) { a.traits.push(id); a.traitLv[id] = 1; }
  else if ((a.traitLv[id]||1) < (def.max||1)) a.traitLv[id]++;
}
function hasTrait(a, id) { return a.traits.includes(id); }

// Keep an actor's seed traits in sync with its stage (called from checkEvo).
function syncSeedTraits(a) {
  const seeds = STAGE_SEED_TRAITS[a.stg];
  if (seeds) for (const id of seeds) if (!hasTrait(a, id)) grantTrait(a, id);
}

// ── Dispatchers — fan a phase out across an actor's traits ──
function traitTick(a, dt) {
  for (const k in a.traitCd) if (a.traitCd[k] > 0) a.traitCd[k] = Math.max(0, a.traitCd[k] - dt);
  for (const id of a.traits) { const t = TRAITS[id]; if (t && t.onTick) t.onTick(a, dt); }
}
function traitTap(a) {
  // First activated trait that's off cooldown consumes the tap.
  for (const id of a.traits) {
    const t = TRAITS[id]; if (!t || !t.onTap) continue;
    if ((a.traitCd[id]||0) > 0) continue;
    if (t.onTap(a)) { if (t.cd) a.traitCd[id] = t.cd; return true; }
  }
  return false;
}
function traitOnKill(a, prey) { for (const id of a.traits) { const t = TRAITS[id]; if (t && t.onKill) t.onKill(a, prey); } }
function traitDraw(a, ts)     { for (const id of a.traits) { const t = TRAITS[id]; if (t && t.draw) t.draw(a, ts); } }

// ═══════════════════════════════════════════
// ADAPTATION CHOOSER — deal a hand of trait cards, pick one (see docs/TRAIT_SYSTEM.md)
// ═══════════════════════════════════════════
let adaptOpen = false;

// Which traits the actor is *eligible* to be offered: not yet maxed.
function eligibleTraits(a) {
  return Object.keys(TRAITS).filter(id => {
    const def = TRAITS[id];
    const lv = a.traitLv[id] || 0;
    return lv < (def.max || 1);
  });
}

// Deal up to `n` distinct cards, weighted toward category variety so a hand isn't
// three of the same flavor. Cards already owned read as "upgrades", new ones as "new".
function dealHand(a, n = 3) {
  const pool = eligibleTraits(a);
  const picked = [], seenCat = {};
  // Shuffle (Fisher–Yates)
  for (let i = pool.length - 1; i > 0; i--) { const j = rni(0, i + 1); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  // First pass: prefer unseen categories for variety
  for (const id of pool) {
    if (picked.length >= n) break;
    const c = TRAITS[id].cat;
    if (seenCat[c]) continue;
    picked.push(id); seenCat[c] = 1;
  }
  // Second pass: fill remaining slots with anything left
  for (const id of pool) { if (picked.length >= n) break; if (!picked.includes(id)) picked.push(id); }
  return picked;
}

function openAdapt(a) {
  const hand = dealHand(a, 3);
  if (!hand.length) return;                 // everything maxed — skip silently
  adaptOpen = true; paused = true;          // freeze sim while choosing
  const wrap = document.getElementById('adaptCards');
  wrap.innerHTML = '';
  for (const id of hand) {
    const def = TRAITS[id], owned = (a.traitLv[id] || 0) > 0;
    const card = document.createElement('div');
    card.className = 'adaptCard';
    const lvTxt = owned ? `▲ UPGRADE · LV ${(a.traitLv[id]||0)+1}/${def.max}` : 'NEW ADAPTATION';
    card.innerHTML =
      `<div class="cCat">${def.cat}</div>` +
      `<div class="cName">${def.name}</div>` +
      `<div class="cDesc">${def.desc}</div>` +
      `<div class="cLv${owned?' up':''}">${lvTxt}</div>`;
    card.onclick = () => chooseAdapt(a, id);
    wrap.appendChild(card);
  }
  document.getElementById('adapt').classList.add('on');
}

function chooseAdapt(a, id) {
  grantTrait(a, id);
  adaptOpen = false; paused = false;
  document.getElementById('adapt').classList.remove('on');
  const def = TRAITS[id];
  burst(P.x, P.y, '#9CF0FF', 22, 3); ring(P.x, P.y, '#9CF0FF', P.r * 1.6, 18);
  fTxt(P.x, P.y - 30, def.name.toUpperCase(), '#9CF0FF');
  try { sfxEvo(); } catch (e) {}
}

function useAbil() {
  // Trait-based activated abilities get first dibs on the tap (engine path).
  if (traitTap(P)) return;
  // ── Legacy stage abilities (not yet migrated to traits) ──
  if (abil_cd>0) return;
  const s=stg(); if(!s.ab||s.cd===0) return;
  switch (s.ab) {
    case 'dash': P.dash=true; P.dashT=180; abil_cd=s.cd; burst(P.x,P.y,s.c.pri,6,2.5); shk(1.5,50); break;
    case 'whip': {
      abil_cd=s.cd; const wR=P.r*4.5, bA=P.hd+PI;
      for (const o of gNear(P.x,P.y,wR)) {
        const d=dst(P,o); if(d<wR){ const a=ang(P,o),df=Math.abs(Math.atan2(Math.sin(a-bA),Math.cos(a-bA))); if(df<PI*.55){o.hp-=3;o.flT=200;o.stunT=600;o.vx+=Math.cos(a)*8;o.vy+=Math.sin(a)*8;burst(o.x,o.y,COL.naga.pri,4,1.5);} }
      }
      for (let i=0;i<16;i++){const a=bA-PI*.55+(i/16)*PI*1.1,d=wR*rng(.4,1);parts.push({x:P.x+Math.cos(a)*d,y:P.y+Math.sin(a)*d,vx:Math.cos(a)*2,vy:Math.sin(a)*2,r:2,life:250,ml:250,c:COL.naga.pri,t:'c'});}
      shk(4,150); sfxHurt(); break; }
    // 'bolt' migrated to the trait engine (TRAITS.bolt) — handled by traitTap above.
